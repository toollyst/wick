#
# Looks for the late answer of a restored smp guest on GitHub's Linux runner
# (CI runs 43486495448 and 43521200989: the shell answered its first command
# after a restore only once more input came): the smp snapshot restored
# many times, each in a new process, against resumes in the same process,
# with the guest's interrupts and timers, Firecracker's page faults and KVM's
# trace events per round (tools/linux/boot-test.sh --stage restores). A
# workflow of its own, run by hand (gh workflow run linux-restore-repro.yml),
# so it cancels nothing of ci.yml's.
name: linux-restore-repro

on:
  workflow_dispatch:
    inputs:
      snapshots:
        description: "snapshots of the smp guest"
        default: "3"
      rounds:
        description: "restores of each snapshot"
        default: "10"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  restores:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false
      - run: tools/setup.sh
      - name: Give the runner user /dev/kvm
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm
      - name: Release build (upstream's tools/release.sh, musl)
        run: tools/linux/devctr.sh --chown lib/firecracker/build -- ./tools/release.sh --libc musl --profile release
      - name: Host
        run: |
          uname -a
          lscpu | head -20
          grep -H . /sys/module/kvm*/parameters/* || true
      - name: Restores
        env:
          WICK_KVM_TRACE: "1"
          SNAPSHOTS: ${{ inputs.snapshots || '3' }}
          ROUNDS: ${{ inputs.rounds || '10' }}
        run: tools/linux/boot-test.sh --workdir "$RUNNER_TEMP/boot-test" --stage restores --snapshots "$SNAPSHOTS" --rounds "$ROUNDS"
      - name: Keep the results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-restore-repro
          path: |
            ${{ runner.temp }}/boot-test/results-*/
            !${{ runner.temp }}/boot-test/results-*/*.mem
            !${{ runner.temp }}/boot-test/results-*/*.state
