#
# Release (CONTRIBUTING.md, "Releases"): pushing a tag vX.Y.Z (the release of an
# upstream base) or vX.Y.Z+wick.N (a wick fix release on it) builds the
# macOS (Apple silicon) binary, signs it with the Hypervisor.framework
# entitlement and publishes it as a GitHub Release in the upstream Firecracker
# release layout (tools/package-release.sh), with an SBOM, a SHA256SUMS file
# and signed build provenance (SECURITY.md, "Verifying a release"). Hosted
# runners cannot run HVF guests, so the guest smoke test runs on a Mac before
# the tag is pushed.
#
# Each job gets only the permissions it needs: the build, which runs the crates'
# build scripts, can read the repository and nothing else; the attestation job
# can sign but not write to the repository; only the last job, which runs no
# code from the repository, can create the release.
name: release

on:
  push:
    tags: ["v[0-9]*.[0-9]*.[0-9]*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)build and upload, e.g. v1.18.0 or v1.18.0+wick.1"
        required: true

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  darwin-aarch64:
    # hv_gic_* needs the macOS 15 SDK.
    runs-on: macos-15
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      MACOSX_DEPLOYMENT_TARGET: "15.0"
    outputs:
      base: ${{ steps.version.outputs.base }}
      # MACOS_RELEASE_BINS and MACOS_RELEASE_HV_BINS (tools/common.sh), for
      # the attestations (JSON) and the release notes.
      bins: ${{ steps.version.outputs.bins }}
      bins_text: ${{ steps.version.outputs.bins_text }}
      hv_bins_text: ${{ steps.version.outputs.hv_bins_text }}
    steps:
      # fetch-depth 0 fetches every branch, origin/main included.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
          submodules: true
          persist-credentials: false
      - name: Tag must be on main
        run: |
          git merge-base --is-ancestor "$(git rev-parse HEAD)" origin/main \
            || { echo "::error::$TAG is not on main"; exit 1; }
      - name: Tag must be the version in patches/base and patches/version
        id: version
        run: |
          source tools/common.sh
          version="$(wick_version)"
          [[ "$TAG" == "v$version" ]] \
            || { echo "::error::$TAG is not v$version (patches/base + patches/version)"; exit 1; }
          {
            echo "base=$(upstream_base)"
            echo "bins=$(printf '%s\n' "${MACOS_RELEASE_BINS[@]}" | python3 -c 'import json, sys; print(json.dumps(sys.stdin.read().split()))')"
            echo "bins_text=${MACOS_RELEASE_BINS[*]}"
            echo "hv_bins_text=${MACOS_RELEASE_HV_BINS[*]}"
          } >>"$GITHUB_OUTPUT"
      - name: Apply and check the patch series
        run: |
          tools/setup.sh
          tools/patches.sh check
      # Built from crates.io with their own lockfiles, at the versions wick pins.
      - name: Install cargo-deny and cargo-cyclonedx
        run: |
          source tools/common.sh
          cargo install --locked cargo-deny --version "$(cargo_deny_version)"
          cargo install --locked cargo-cyclonedx --version "$CARGO_CYCLONEDX_VERSION"
      - name: Dependency checks (advisories, licenses, sources)
        run: tools/check-dependencies.sh
      - name: Build, sign and package
        run: tools/package-release.sh "$TAG" dist
      # From the archive, unpacked afresh: every binary of the list
      # (tools/common.sh), its signature, the entitlement on exactly those
      # that create a VM, its version, and its SBOM.
      - name: Verify the package
        run: |
          source tools/common.sh
          cd dist
          suffix="$TAG-darwin-aarch64"
          shasum -a 256 -c "wick-$suffix.tgz.sha256.txt"
          tar -xzf "wick-$suffix.tgz"
          (cd "release-$suffix" && shasum -a 256 -c SHA256SUMS)
          for bin in "${MACOS_RELEASE_BINS[@]}"; do
            path="release-$suffix/$bin-$suffix"
            codesign --verify --strict "$path"
            if [[ " ${MACOS_RELEASE_HV_BINS[*]} " == *" $bin "* ]]; then
              codesign -d --entitlements - "$path" 2>/dev/null | grep -q com.apple.security.hypervisor \
                || { echo "::error::$bin has no hypervisor entitlement"; exit 1; }
            elif codesign -d --entitlements - "$path" 2>/dev/null | grep -q com.apple.security; then
              echo "::error::$bin has entitlements"; exit 1
            fi
            reported="$("$path" --version)"
            reported="${reported%%$'\n'*}"
            echo "$bin: $reported"
            [[ "${reported##* }" == "$TAG" ]] \
              || { echo "::error::$bin reports '$reported', not version $TAG"; exit 1; }
            python3 -c 'import json, sys; assert json.load(open(sys.argv[1]))["metadata"]["component"]["name"] == sys.argv[2]' \
              "$bin-$suffix.cdx.json" "$bin"
          done
          rm -rf "release-$suffix"
          ls -l
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-darwin-aarch64
          path: dist/
          if-no-files-found: error
          retention-days: 7

  # Signed SLSA build provenance, bound to the archive and to every binary in
  # it, and each binary's SBOM, bound to the archive and to that binary
  # (`gh attestation verify`), recorded for this repository. One job per
  # binary of the build job's list, which is tools/common.sh's.
  attest:
    needs: darwin-aarch64
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      id-token: write
      attestations: write
    strategy:
      fail-fast: true
      matrix:
        bin: ${{ fromJSON(needs.darwin-aarch64.outputs.bins) }}
    env:
      BIN: ${{ matrix.bin }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-darwin-aarch64
          path: dist
      - name: Check the archive and take out the binary
        run: |
          cd dist
          suffix="$TAG-darwin-aarch64"
          sha256sum -c "wick-$suffix.tgz.sha256.txt"
          mkdir ../bin
          tar -xzf "wick-$suffix.tgz" -C ../bin --strip-components 1 "release-$suffix/$BIN-$suffix"
          ls -l ../bin
      - name: Build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/wick-${{ env.TAG }}-darwin-aarch64.tgz
            bin/${{ matrix.bin }}-${{ env.TAG }}-darwin-aarch64
      - name: SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            dist/wick-${{ env.TAG }}-darwin-aarch64.tgz
            bin/${{ matrix.bin }}-${{ env.TAG }}-darwin-aarch64
          sbom-path: dist/${{ matrix.bin }}-${{ env.TAG }}-darwin-aarch64.cdx.json

  publish:
    needs: [darwin-aarch64, attest]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      BASE: ${{ needs.darwin-aarch64.outputs.base }}
      BINS: ${{ needs.darwin-aarch64.outputs.bins_text }}
      HV_BINS: ${{ needs.darwin-aarch64.outputs.hv_bins_text }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-darwin-aarch64
          path: dist
      - name: SHA256SUMS
        run: |
          cd dist
          sha256sum -c ./*.sha256.txt
          sha256sum -- *.tgz *.cdx.json >SHA256SUMS
          sha256sum -c SHA256SUMS
          cat SHA256SUMS
      - name: Publish the release
        run: |
          name="wick-$TAG-darwin-aarch64"
          notes="wick $TAG, built from upstream Firecracker $BASE.

          - $name.tgz: macOS 15+ on Apple silicon (Hypervisor.framework). Upstream's release
            layout: $BINS, the API specification, the aarch64 CPU template, LICENSE, NOTICE,
            THIRD-PARTY and SHA256SUMS; not seccompiler-bin or the seccomp filter, as macOS
            has no seccomp-BPF. Ad-hoc signed, $HV_BINS with the
            com.apple.security.hypervisor entitlement; not notarized.
            A browser's download carries com.apple.quarantine, and tar copies it onto the
            files; if macOS refuses to run the binary, clear it: xattr -d com.apple.quarantine
            $name.tgz before extracting (README.md, \"Get started\").
          - <binary>-$TAG-darwin-aarch64.cdx.json: each binary's SBOM (CycloneDX 1.5), every crate
            it is built from.
          - SHA256SUMS: SHA-256 of every file. Check: shasum -a 256 -c SHA256SUMS
          - Build provenance and the SBOM are signed attestations of this repository's
            release workflow. Check: gh attestation verify $name.tgz --repo $GITHUB_REPOSITORY
            (SECURITY.md, \"Verifying a release\")."
          files=(dist/*.tgz dist/*.sha256.txt dist/*.cdx.json dist/SHA256SUMS)
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "${files[@]}" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" "${files[@]}" --repo "$GITHUB_REPOSITORY" \
              --title "$TAG" --notes "$notes" --verify-tag
          fi
