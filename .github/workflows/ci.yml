          # alone, both APIC modes, and the x2APIC bit of CPUID.
          alone whp::vcpu::fpu_tests::test_a_linux_guests_special_registers_on_record
          # The guest's CPUID and the partition's xAPIC agree (X2APICTEST
          # lines): no x2APIC in the supported CPUID, KVM_SET_CPUID2 of a
