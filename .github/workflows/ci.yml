#
# Build and test wick on Linux, macOS and Windows (CONTRIBUTING.md, "Tests").
name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Weekly, with all of upstream's functional and security integration tests.
  schedule:
    - cron: "23 3 * * 1"
  workflow_dispatch:
    inputs:
      integration:
        description: "Linux integration tests: the subset every push runs, or upstream's functional and security suites"
        type: choice
        options: [subset, full]
        default: subset

permissions:
  contents: read

concurrency:
  # A push does not cancel the weekly or a full run on the same branch.
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}-${{ inputs.integration }}
  cancel-in-progress: true

jobs:
  patches:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # The whole history: check-claims.py checks that every commit a doc
      # cites is an ancestor of HEAD, and fails in a shallow clone.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          fetch-depth: 0
          persist-credentials: false
      # Upstream's tag from an earlier run's cache, or fetched (.github/actions/upstream).
      - uses: ./.github/actions/upstream
      - name: Apply the patch series
        run: tools/setup.sh
      - name: Check the patch series
        run: tools/patches.sh check
      - name: Check generated Windows sources
        run: |
          (cd lib/firecracker && cargo fetch --locked -q)
          tools/gen-kvm-bindings-windows.sh --check
          tools/gen-windows-sources.sh --check
      # Without a build: wick's Linux builds compile every crate upstream's do,
      # with upstream's features, and the macOS builds are their baseline
      # (tools/unit-graph); a change to either is a finding, not a sentence in
      # a commit message (CI run 43790310601).
      - name: Linux and macOS compile upstream's crates with upstream's features
        run: |
          python3 -I -B tools/check-unit-graph.py --selftest
          python3 -I -B tools/check-unit-graph.py --fetch
      - name: Actions are pinned by commit
        run: |
          # This repository's own actions (uses: ./...) are its files; theirs are checked too.
          unpinned="$(grep -nE '^\s*(-\s+)?uses:' .github/workflows/*.yml .github/actions/*/action.yml | grep -vE 'uses:\s*([^@ ]+@[0-9a-f]{40}( |$)|\./)' || true)"
          [[ -z "$unpinned" ]] || { echo "::error::actions not pinned by full commit SHA:"; echo "$unpinned"; exit 1; }
      # Every "in place", "verified" or "measured" in the docs' tables names
      # the test that checks it, Windows cells included; every commit a doc
      # cites is on main (an ancestor of HEAD), not a branch's.
      - name: Doc claims name their tests
        run: |
          python3 tools/check-claims.py --selftest
          python3 tools/check-claims.py --strict-windows
      # The pushed commits' messages: a same-build claim ("Linux and macOS are
      # unchanged", "trees unchanged") names tools/check-unit-graph.py, and a
      # "not weaker" its evidence (e756d504's untrue "trees unchanged"). History
      # is not rewritten: a red run here is corrected by the next commit.
      - name: Commit messages name the checks of their same-build claims
        if: github.event_name == 'push' || github.event_name == 'pull_request'
        env:
          BEFORE: ${{ github.event_name == 'push' && github.event.before || github.event.pull_request.base.sha }}
        run: |
          if ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            echo "::error::the pushed range's base $BEFORE is not in this clone (a force-push?): its messages cannot be read"
            exit 1
          fi
          # The documents' checks again, with the range's messages.
          python3 tools/check-claims.py --strict-windows --commits "$BEFORE..HEAD"
      - name: Compatibility matrix progress and counts are current
        run: python3 -I tools/compat-counts.py --check docs/COMPATIBILITY.md
      # The numbers the docs derive from the tree that the two checks above
      # do not keep: README's line count, PORTING row 1's sandbox counts.
      - name: Results readers and format
        run: python3 -I tools/ci-results.py --selftest
      - name: Numbers derived from the tree are current
        run: |
          python3 -I -B tools/check-derived.py --selftest
          python3 -I -B tools/check-derived.py
      - name: Cleanup script
        run: |
          bash -n tools/clean.sh
          tools/clean.sh --dry-run
      # Every loop a shell tool starts in the background ends with its owner
      # and has a bound (375 orphaned loops were found at a shutdown stall).
      - name: Background loops have an end
        run: |
          python3 -I -B tools/check-background-loops.py --selftest
          python3 -I -B tools/check-background-loops.py

  # Dependency policy (CONTRIBUTING.md, "Dependencies"): RustSec advisories,
  # licenses, banned and duplicate crates and sources for lib/firecracker's
  # Cargo.lock and tools/vhost-user-blk's, with cargo-deny at upstream's
  # version. The weekly run catches advisories published against an unchanged
  # lockfile.
  dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false
      # Upstream's tag from an earlier run's cache, or fetched (.github/actions/upstream).
      - uses: ./.github/actions/upstream
      - run: tools/setup.sh
      - name: Install cargo-deny
        run: |
          source tools/common.sh
          cargo install --locked cargo-deny --version "$(cargo_deny_version)"
      - name: Dependency checks
        run: tools/check-dependencies.sh

  linux:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false
      # Upstream's tag from an earlier run's cache, or fetched (.github/actions/upstream).
      - uses: ./.github/actions/upstream
      - run: tools/setup.sh
      - name: Report KVM availability
        run: ls -l /dev/kvm || echo "no /dev/kvm on ${{ matrix.runner }}"
      - name: Install build dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libseccomp-dev
      - name: Build firecracker
        working-directory: lib/firecracker
        run: cargo build --locked -p firecracker
      # What upstream's jailer does with the freezer and devices cgroups (the
      # reference for the macOS and Windows jailers), measured as root.
      - name: Build the jailer
        working-directory: lib/firecracker
        run: cargo build --locked -p jailer
      - name: Upstream jailer's freezer and devices cgroups
        run: sudo python3 -I tools/linux/jailer-cgroup-check.py --jailer lib/firecracker/build/cargo_target/debug/jailer

  # Upstream's unit tests as upstream's CI runs them (its development
  # container, as root, musl, one test thread: tools/linux/unit-tests.sh),
  # first for plain upstream at patches/base and then for wick, on the same
  # machine. wick must match upstream test by test; tests that fail on plain
  # upstream there are listed with the reason in
  # tools/linux/unit-test-exclusions.txt. The x86_64 runner has KVM, the arm
  # one does not.
  linux-unit-tests:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false
      # Upstream's tag from an earlier run's cache, or fetched (.github/actions/upstream).
      - uses: ./.github/actions/upstream
      - name: Set up upstream and the patch series
        id: setup
        run: tools/setup.sh
      - name: Host
        run: |
          uname -a
          df -h /
          grep -m1 '^model name' /proc/cpuinfo || true
          nproc
          free -g
          ls -l /dev/kvm || echo "no /dev/kvm on ${{ matrix.runner }}"
      - name: Unit tests, plain upstream
        run: tools/linux/unit-tests.sh upstream "$RUNNER_TEMP/unit/upstream"
      - name: Unit tests, wick
        run: tools/linux/unit-tests.sh wick "$RUNNER_TEMP/unit/wick"
      - name: Compare wick with upstream
        run: |
          tools/linux/compare-unit-tests.py "$RUNNER_TEMP/unit/upstream" "$RUNNER_TEMP/unit/wick" \
            --summary "$GITHUB_STEP_SUMMARY"
      # Every test's result in one format (tools/ci-results.py, results.tsv),
      # for the docs' run claims; a step that did not run gives no rows.
      - name: Results in one format
        if: always() && steps.setup.outcome == 'success'
        env:
          WICK_RESULTS_JOB: linux-unit-tests (${{ matrix.runner }})
        run: |
          for tree in upstream wick; do
            for f in "$RUNNER_TEMP/unit/$tree/lib.run.log" "$RUNNER_TEMP/unit/$tree/examples.run.log"; do
              if [ -f "$f" ]; then python3 -I tools/ci-results.py add libtest "$f" --tree "$tree" --out "$RUNNER_TEMP/results.tsv"; fi
            done
          done
          r="$RUNNER_TEMP/results.tsv"
          if [ -f "$r" ]; then python3 -I tools/ci-results.py validate "$r"; else echo "no results: no test step wrote its output"; fi
      - name: Upload the results
        if: always() && steps.setup.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: results-linux-unit-tests-${{ runner.arch }}
          path: ${{ runner.temp }}/results.tsv
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload logs
        if: always() && steps.setup.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-unit-tests-${{ runner.arch }}
          path: |
            ${{ runner.temp }}/unit/*/*.log
            ${{ runner.temp }}/unit/*/*.json
            ${{ runner.temp }}/unit/*/*.status
            ${{ runner.temp }}/unit/*/arch
            ${{ runner.temp }}/unit/*/cpu
          if-no-files-found: warn
          retention-days: 14

  # A guest on KVM with the binary upstream would ship: tools/release.sh's
  # musl release build (seccomp filters installed), booted by
  # tools/linux/boot-test.sh with upstream's CI kernel and rootfs.
  linux-boot:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false
      # Upstream's tag from an earlier run's cache, or fetched (.github/actions/upstream).
      - uses: ./.github/actions/upstream
      - name: Set up upstream and the patch series
        id: setup
        run: tools/setup.sh
      - name: Give the runner user /dev/kvm
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm
      - name: Release build (upstream's tools/release.sh, musl)
        run: tools/linux/devctr.sh --chown lib/firecracker/build -- ./tools/release.sh --libc musl --profile release
      # Upstream's release.sh builds without --locked.
      - name: The build kept Cargo.lock
        run: git -C lib/firecracker diff --exit-code -- Cargo.lock
      # vm_stop against a stand-in for a Firecracker that answered patches/
      # 0050's 500: one that exits only once the harness waits for it (both
      # exit lines in its log, exit 1, nothing of the wait left running) and
      # one that never exits (a failed check at the bound, killed, its log
      # saying so). The guest stages reach that path only on such an answer.
      # Needs no build and no VM.
      - name: boot-test.sh selftest
        run: tools/linux/boot-test.sh --selftest
      - name: Boot test
        run: tools/linux/boot-test.sh --workdir "$RUNNER_TEMP/boot-test"
      # Linux's side of the lazy-RAM grain (records, printed only), under
      # each THP setting, the runner's own restored after: KVM guest RAM
      # mapped as upstream's, its Rss and cgroup charge after the guest's
      # sparse and dense steps at the Windows record's guest addresses
      # (LINUXGRAIN lines; LAZYGRAIN in the windows job); and upstream
      # Firecracker booted with huge_pages None and Transparent, its guest
      # memory after the shell and after a guest's tmpfs work (GUESTRAM
      # lines; VMMGUEST in the windows job's vmm-memory-record.py --boot);
      # the host lines name each mTHP size's setting, the grain of the
      # LINUXGRAIN per-page cost FIRSTTOUCH is set against.
      # Then, under the runner's own setting, what a 1 GiB guest that touched
      # 64 MiB is charged after a full and a diff snapshot, and what a
      # restore from the full snapshot's file is charged (anon and the page
      # cache, in a cgroup each; GUESTSNAP lines; VMMSNAP in the windows job),
      # and the guest's LVT timer writes and #GPs (GUESTAPIC lines).
      - name: Guest RAM by the host's THP setting (records)
        run: |
          python3 -I tools/linux/guest-ram-record.py --selftest
          fc="lib/firecracker/build/cargo_target/$(uname -m)-unknown-linux-musl/release/firecracker"
          cc -O2 -Wall -Wextra -Werror -o "$RUNNER_TEMP/guest-ram-grain" tools/linux/guest-ram-grain.c
          sudo ip tuntap add dev wickgr0 mode tap
          sudo ip link set wickgr0 up
          thp=/sys/kernel/mm/transparent_hugepage/enabled
          was=$(sed -n 's/.*\[\(.*\)\].*/\1/p' "$thp")
          echo "the runner's transparent_hugepage setting: $was"
          sudo mkdir -p /sys/fs/cgroup/wick-grain
          for setting in madvise always; do
            echo "$setting" | sudo tee "$thp" >/dev/null
            # In a cgroup of its own, for its memory.current.
            sudo sh -c 'echo $$ > /sys/fs/cgroup/wick-grain/cgroup.procs && exec "$0"' "$RUNNER_TEMP/guest-ram-grain" \
              || echo "::warning::guest-ram-grain did not finish under $setting"
            sudo python3 -I tools/linux/guest-ram-record.py --tap wickgr0 "$fc" "$RUNNER_TEMP/boot-test" \
              || echo "::warning::guest-ram-record.py did not finish under $setting"
          done
          echo "$was" | sudo tee "$thp" >/dev/null
          sudo python3 -I tools/linux/guest-ram-record.py --snapshot "$fc" "$RUNNER_TEMP/boot-test" \
            || echo "::warning::guest-ram-record.py --snapshot did not finish"
          # The same guest's LVT timer writes, TSC_DEADLINE writes and the
          # #GPs KVM injects, by KVM's tracepoints, over the boot, the idle
          # shell and GUEST_WORK (GUESTAPIC lines): the rate option E of
          # the Windows x2APIC cell would exit at.
          sudo python3 -I tools/linux/guest-ram-record.py --apic "$fc" "$RUNNER_TEMP/boot-test" \
            || echo "::warning::guest-ram-record.py --apic did not finish"
          sudo rmdir /sys/fs/cgroup/wick-grain || true
          sudo ip link del wickgr0
      # A host without /dev/nitro_enclaves: the start of an enclave is refused,
      # and the same script checks the same replies on macOS.
      - name: Nitro Enclave refused without the device
        run: python3 -I tools/macos/enclave-refusal-test.py "lib/firecracker/build/cargo_target/$(uname -m)-unknown-linux-musl/release/firecracker"
      # A request in flight when the VMM ends (patches/0050, an upstream
      # defect fixed on every host): answered 500, and Firecracker exits
      # with the build's error and code, not SIGABRT; the macos job runs it too.
      - name: API request in flight when the VMM ends
        run: python3 -I tools/macos/api-vmm-ended-test.py "lib/firecracker/build/cargo_target/$(uname -m)-unknown-linux-musl/release/firecracker"
      # One snapshot's state file made here, on Linux x86_64: what the macos
      # job's foreign snapshot step (tools/macos/foreign-snapshot-test.py) is
      # given, a state made on another host OS; boot-test.ps1's
      # foreign-snapshot stage takes an aarch64 one as -ForeignState (an x86_64
      # state decodes on Windows; that case is the linux-snapshot stage, in
      # the windows-guest job, with the whole snapshot kept below).
      - name: A snapshot's state file for the other hosts' tests
        run: python3 -I tools/linux/make-vmstate.py "lib/firecracker/build/cargo_target/$(uname -m)-unknown-linux-musl/release/firecracker" "$RUNNER_TEMP/boot-test" "$RUNNER_TEMP/vmstate" "$RUNNER_TEMP/vmsnapshot"
      # Every test's result in one format (tools/ci-results.py, results.tsv),
      # for the docs' run claims; a step that did not run gives no rows.
      - name: Results in one format
        if: always() && steps.setup.outcome == 'success'
        env:
          WICK_RESULTS_JOB: linux-boot
        run: |
          for f in "$RUNNER_TEMP"/boot-test/results-*/summary.txt; do
            if [ -f "$f" ]; then python3 -I tools/ci-results.py add summary "$f" --suite tools/linux/boot-test.sh --out "$RUNNER_TEMP/results.tsv"; fi
          done
          r="$RUNNER_TEMP/results.tsv"
          if [ -f "$r" ]; then python3 -I tools/ci-results.py validate "$r"; else echo "no results: no test step wrote its output"; fi
      - name: Upload the results
        if: always() && steps.setup.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: results-linux-boot
          path: ${{ runner.temp }}/results.tsv
          if-no-files-found: ignore
          retention-days: 14
      # The whole snapshot, memory file too (128 MiB before the artifact's
      # compression): what a Windows host of the same architecture restores
      # (boot-test.ps1 linux-snapshot).
      - name: Upload the whole snapshot
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-snapshot
          path: ${{ runner.temp }}/vmsnapshot/
          if-no-files-found: error
          retention-days: 3
      - name: Upload the state file
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-vmstate
          path: ${{ runner.temp }}/vmstate/
          if-no-files-found: error
          retention-days: 90
      - name: Upload logs
        if: always() && steps.setup.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-boot-test
          path: ${{ runner.temp }}/boot-test/results-*
          if-no-files-found: warn
          retention-days: 14

  # Upstream's integration tests (pytest) as upstream's devtool runs them
  # (tools/linux/integration-tests.sh): plain upstream, then wick, on the same
  # machine, compared test by test. Every push runs a subset (API, boot and
  # serial, block, vsock, net, balloon, entropy, pause/resume, snapshots,
  # userfaultfd, jailer, seccomp); the weekly run and a dispatch with
  # integration=full run upstream's functional and security suites, as its
  # PR pipeline does. Guest kernel 6.1 only (CONTRIBUTING.md, "Tests").
  linux-integration-tests:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ (github.event_name == 'schedule' || inputs.integration == 'full') && 150 || 75 }}
    env:
      SUITE: ${{ (github.event_name == 'schedule' || inputs.integration == 'full') && 'full' || 'subset' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false
      # Upstream's tag from an earlier run's cache, or fetched (.github/actions/upstream).
      - uses: ./.github/actions/upstream
      - name: Set up upstream and the patch series
        id: setup
        run: tools/setup.sh
      - name: Host
        run: |
          uname -a
          grep -m1 '^model name' /proc/cpuinfo
          nproc
          free -g
          df -h /
      - name: Select the tests
        id: select
        run: |
          if [[ "$SUITE" == full ]]; then
            tests="integration_tests/functional integration_tests/security"
          else
            tests="$(printf 'integration_tests/%s ' \
              functional/test_api.py functional/test_drive_virtio.py functional/test_vsock.py \
              functional/test_snapshot_basic.py functional/test_serial_io.py functional/test_shut_down.py \
              functional/test_cmd_line_start.py functional/test_pause_resume.py functional/test_net.py \
              functional/test_balloon.py functional/test_rng.py functional/test_uffd.py \
              security/test_jail.py security/test_seccomp.py)"
          fi
          echo "TESTS=-n 4 --dist worksteal $tests" >>"$GITHUB_ENV"
          echo "$SUITE: $tests"
      # The steps after plain upstream's run still run when it has failed,
      # so that one failure does not hide the rest, but never after a failed
      # checkout or setup (steps.setup: skipped or failed) or a failed choice
      # of tests, whose cause they would bury under failures of their own.
      # $TESTS is split into pytest's arguments on purpose.
      - name: Integration tests, plain upstream
        run: |
          # shellcheck disable=SC2086
          tools/linux/integration-tests.sh upstream "$RUNNER_TEMP/it/upstream" $TESTS
      - name: Integration tests, wick
        if: (success() || failure()) && steps.setup.outcome == 'success' && steps.select.outcome == 'success'
        run: |
          # shellcheck disable=SC2086
          tools/linux/integration-tests.sh wick "$RUNNER_TEMP/it/wick" $TESTS
      - name: Compare wick with upstream
        if: (success() || failure()) && steps.setup.outcome == 'success' && steps.select.outcome == 'success'
        run: |
          tools/linux/compare-integration-tests.py "$RUNNER_TEMP/it/upstream" "$RUNNER_TEMP/it/wick" \
            --summary "$GITHUB_STEP_SUMMARY"
      # Informational, never fails the job: the VMM's own memory at its peak,
      # by kind of mapping, for the tests whose memory macOS compares with
      # Linux's (tools/linux/integration/wick_memdiag.py, loaded in this step
      # only: the steps above keep upstream's monitor as it is). With them,
      # the tests Windows compares: test_cpuid boots 1, 2 and 16 vCPUs on
      # any host (its own parameters), which gives what a vCPU adds here,
      # thread stacks and kvm vcpu pages apart; Windows fails it on the
      # 5 MiB budget at 16. test_all_vcpus_online, which fails there too,
      # takes as many vCPUs as the host has processors, up to 32: on this
      # runner that is a few (the table's vcpus column says how many). The
      # other five tests Windows fails on that budget are run for their
      # rows as well. Run 43388798760's table had thread stacks and anon
      # other at 0 and every anonymous mapping under file other: psutil
      # names an anonymous mapping "[anon]", which the classifier now
      # reads (its selftest runs first).
      - name: VMM memory by kind of mapping (informational)
        if: (success() || failure()) && steps.setup.outcome == 'success'
        continue-on-error: true
        run: |
          python3 -I tools/linux/integration/wick_memdiag.py selftest
          WICK_IT_MEMDIAG=1 tools/linux/integration-tests.sh wick "$RUNNER_TEMP/it/memdiag" -n 1 \
            integration_tests/functional/test_vsock.py::test_vsock_epipe \
            integration_tests/functional/test_vsock.py::test_vsock_transport_reset_h2g \
            integration_tests/functional/test_balloon.py::test_deflate_on_oom \
            integration_tests/functional/test_cpu_features_x86_64.py::test_cpuid \
            integration_tests/functional/test_cpu_all.py::test_all_vcpus_online \
            integration_tests/functional/test_cpu_all.py::test_all_vcpus_have_same_features \
            integration_tests/functional/test_topology.py::test_cache_topology \
            integration_tests/functional/test_hotplug.py::test_hotplug_max_devices \
            integration_tests/functional/test_metrics.py::test_net_metrics \
            integration_tests/functional/test_api.py::test_get_full_config_after_restoring_snapshot
          python3 -I tools/linux/integration/wick_memdiag.py summary \
            "$RUNNER_TEMP/it/memdiag/memory-peaks.jsonl" | tee -a "$GITHUB_STEP_SUMMARY"
      # Upstream's release.sh, which the tests build with, has no --locked.
      - name: The build kept Cargo.lock
        if: (success() || failure()) && steps.setup.outcome == 'success'
        run: git -C lib/firecracker diff --exit-code -- Cargo.lock
      # Every test's result in one format (tools/ci-results.py, results.tsv),
      # for the docs' run claims; a step that did not run gives no rows.
      - name: Results in one format
        if: always() && steps.setup.outcome == 'success'
        env:
          WICK_RESULTS_JOB: linux-integration-tests
        run: |
          for tree in upstream wick; do
            f="$RUNNER_TEMP/it/$tree/test-report.json"
            if [ -f "$f" ]; then python3 -I tools/ci-results.py add pytest-json "$f" --tree "$tree" --out "$RUNNER_TEMP/results.tsv"; fi
          done
          r="$RUNNER_TEMP/results.tsv"
          if [ -f "$r" ]; then python3 -I tools/ci-results.py validate "$r"; else echo "no results: no test step wrote its output"; fi
      - name: Upload the results
        if: always() && steps.setup.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: results-linux-integration-tests-${{ env.SUITE }}
          path: ${{ runner.temp }}/results.tsv
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload logs
        if: always() && steps.setup.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-integration-tests-${{ env.SUITE }}
          path: |
            ${{ runner.temp }}/it/*/memory-peaks.jsonl
            ${{ runner.temp }}/it/*/pytest.log
            ${{ runner.temp }}/it/*/test-report.json
            ${{ runner.temp }}/it/*/status
            ${{ runner.temp }}/it/*/arch
          if-no-files-found: warn
          retention-days: 14

  # macOS (Apple silicon): build, lint and the compatibility crates' tests.
  # Booting a guest needs Hypervisor.framework, which hosted runners do not
  # expose, so L3 runs on a Mac (tools/macos/run.sh).
  macos:
    # After linux-boot, for the state file it makes (the foreign snapshot
    # step); it runs when linux-boot has failed too, and that step alone
    # fails then.
    needs: linux-boot
    if: ${{ !cancelled() }}
    runs-on: macos-latest
    # 18.5 minutes in run 43833851623, and the unit step's second vmm run
    # (below) adds about 5.
    timeout-minutes: 40
    env:
      MACOSX_DEPLOYMENT_TARGET: "15.0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false
      # Upstream's tag from an earlier run's cache, or fetched (.github/actions/upstream).
      - uses: ./.github/actions/upstream
      - run: tools/setup.sh
      - name: Install clippy
        working-directory: lib/firecracker
        run: rustup component add clippy
      # Each test step runs after an earlier test's failure, so that one
      # failure does not hide the rest, but never after a failed checkout,
      # setup or build (steps.build: skipped or failed), whose cause it
      # would bury under failures of its own.
      - name: Build firecracker
        id: build
        working-directory: lib/firecracker
        run: cargo build --locked -p firecracker --bin firecracker
      - name: Clippy
        working-directory: lib/firecracker
        run: cargo clippy --locked -p vmm -p firecracker -p wick-ext -p jailer --lib --bins --tests -- -D warnings
      # As upstream on a Linux host without /dev/nitro_enclaves (linux-boot
      # runs the same script there).
      - name: Nitro Enclave refused without the device
        if: (success() || failure()) && steps.build.outcome == 'success'
        run: python3 -I tools/macos/enclave-refusal-test.py lib/firecracker/build/cargo_target/debug/firecracker
      # As linux-boot runs it on Linux (patches/0050).
      - name: API request in flight when the VMM ends
        if: (success() || failure()) && steps.build.outcome == 'success'
        run: python3 -I tools/macos/api-vmm-ended-test.py lib/firecracker/build/cargo_target/debug/firecracker
      # The scenario harness against a stand-in that answers "VMM has ended"
      # and exits only when let go: the harness waits for the exit, so the
      # reason Firecracker logs after that answer is in the log (CI run
      # 43823078930), and one that never exits fails at the bound, killed,
      # its log saying so. Needs no build and no VM.
      - name: boot-test.py selftest
        if: success() || failure()
        run: python3 -I tools/macos/boot-test.py --selftest
      # The jailer's tests run as root, as upstream's do (they set resource
      # limits and change owners); the runners have passwordless sudo.
      - name: Jailer unit tests
        if: (success() || failure()) && steps.build.outcome == 'success'
        working-directory: lib/firecracker
        run: |
          bin=$(cargo test --locked -p jailer --no-run --message-format=json |
            jq -r 'select(.profile.test == true and .target.name == "jailer") | .executable')
          sudo env RUST_TEST_THREADS=1 "$bin" --skip platform::macos::freezer::tests::test_self_check_under_load
          # Its count of the reads the old self-check would have failed on
          # (libtest shows a passing test's output only with --nocapture).
          sudo env RUST_TEST_THREADS=1 "$bin" platform::macos::freezer::tests::test_self_check_under_load --exact --nocapture
      # The freeze stage's judgement of frozen and thawed (the kernel's
      # runnable count against an unjailed control spinner), proven on this
      # runner's own load, where an absolute CPU threshold failed (run
      # 43467381837): spinners held with SIGSTOP judged thawed, and running
      # ones judged frozen, must fail by name. Needs no root.
      - name: Freeze judgement self-check
        if: (success() || failure()) && steps.build.outcome == 'success'
        run: python3 -I tools/macos/jailer-test.py --freeze-self-check
      - name: Jailer scenario tests (without a VM)
        if: (success() || failure()) && steps.build.outcome == 'success'
        id: jailer_scenarios
        run: tools/macos/jailer-test.sh --no-vm
      # What each jailer and Firecracker of a failed stage printed (the run
      # directory: <name>.log, the results): run 43341846250's vmnet failure
      # (a refused connection to the API socket) left nothing to tell a
      # Firecracker that had ended from one not yet listening.
      - name: Upload the jailer scenarios' logs
        if: failure() && steps.jailer_scenarios.conclusion == 'failure'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-jailer-test
          path: build/jailer-test/
          if-no-files-found: warn
          retention-days: 14
      # What the steps run as root (the jailer's unit tests, the jailer
      # scenarios) left in the source tree: nothing of root's, or the steps
      # after, as the runner's user, cannot write there (run 43640510155: a
      # root-owned tools/macos/integration/__pycache__ failed py_compile).
      # build/ (the scenarios' logs) and the cargo target are outputs.
      - name: No root-owned files in the source tree
        if: (success() || failure()) && steps.build.outcome == 'success'
        run: |
          left=$(find . \( -path ./build -o -path ./lib/firecracker/build \) -prune -o -user 0 -print)
          if [ -n "$left" ]; then
            echo "root-owned files in the source tree after the root steps:"
            echo "$left"
            exit 1
          fi
      # The scenario scripts build as the user and ask for sudo themselves for
      # what needs root: run under sudo, each refuses to start before it
      # builds (not_as_root, tools/common.sh), so that no root-owned file is
      # left in the build directories the user's own builds share (a root
      # batch's `sudo tools/macos/boot-test.sh vmnet` once left 283 there,
      # and the user's next jailer-test build failed with "Permission denied").
      # The user's root batch (tools/macos/root-batch.sh): what can be run
      # without root. Its steps themselves need root and a VM; only the
      # user's run shows them.
      - name: The root batch's own logic
        if: (success() || failure()) && steps.build.outcome == 'success'
        run: |
          bash -n tools/macos/root-batch.sh
          tools/macos/root-batch.sh --list
          tools/macos/root-batch.sh --selftest
          /bin/bash tools/macos/root-batch.sh --selftest
      - name: The scenario scripts refuse to run as root
        if: (success() || failure()) && steps.build.outcome == 'success'
        run: |
          before=$(find build lib/firecracker/build -user 0 2>/dev/null | wc -l)
          for script in tools/macos/boot-test.sh tools/macos/jailer-test.sh tools/macos/integration-tests.sh tools/macos/root-batch.sh; do
            if out=$(sudo "$script" 2>&1); then
              echo "$script ran under sudo: $out"
              exit 1
            fi
            case "$out" in
              *"refuses to run as root"*) ;;
              *) echo "$script under sudo failed without the refusal: $out"; exit 1 ;;
            esac
          done
          after=$(find build lib/firecracker/build -user 0 2>/dev/null | wc -l)
          if [ "$after" != "$before" ]; then
            echo "root-owned files in the build directories went from $before to $after"
            exit 1
          fi
      # A state file made on Linux x86_64 by this run's linux-boot job is
      # refused here with upstream's error, before a VM is made (so it needs
      # no Hypervisor.framework). Not run, said so, when linux-boot did not
      # succeed and so made no state file (run 43790310601: its setup could
      # not fetch upstream): that job's own failure is the cause, and it keeps
      # the run red. A missing state file from a linux-boot that succeeded
      # fails here. The steps before and after are not held back.
      - name: Download the state file made on Linux
        # Runs after an earlier step's failure too: each step answers its own question.
        if: (success() || failure()) && steps.build.outcome == 'success'
        id: vmstate
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: linux-vmstate
          path: ${{ runner.temp }}/linux-vmstate
      - name: A snapshot made on Linux x86_64 is refused
        if: (success() || failure()) && steps.build.outcome == 'success'
        working-directory: lib/firecracker
        run: |
          if [ "${{ steps.vmstate.outcome }}" != success ] && [ "${{ needs.linux-boot.result }}" != success ]; then
            echo "::warning::foreign-snapshot-test.py not run: linux-boot ${{ needs.linux-boot.result }}, so it produced no state file"
            exit 0
          fi
          cargo build --locked -p snapshot-editor
          cat "$RUNNER_TEMP/linux-vmstate/linux-x86_64.txt"
          python3 -I ../../tools/macos/foreign-snapshot-test.py build/cargo_target/debug/firecracker \
            build/cargo_target/debug/snapshot-editor "$RUNNER_TEMP/linux-vmstate/linux-x86_64.vmstate"
      # Upstream's integration tests need a VM (tools/macos/integration-tests.sh
      # runs them on a Mac); their harness's network namespace and comparison
      # run here.
      - name: Integration test harness (without a VM)
        # Runs after an earlier step's failure too: each step answers its own question.
        if: (success() || failure()) && steps.build.outcome == 'success'
        run: |
          brew install libslirp pkg-config
          cc -O2 -Wall -Wextra -Werror -o "$RUNNER_TEMP/netns-slirp" tools/macos/integration/netns-slirp.c \
            $(pkg-config --cflags --libs slirp)
          cc -O2 -Wall -Wextra -Werror -dynamiclib -o "$RUNNER_TEMP/netns-preload.dylib" tools/macos/integration/netns-preload.c
          python3 -I tools/macos/integration/netns-selftest.py "$RUNNER_TEMP/netns-slirp" "$RUNNER_TEMP/netns-preload.dylib"
          python3 -m py_compile tools/macos/integration/wick_macos.py tools/macos/integration/wick_macos_net.py \
            tools/macos/integration/jailer tools/macos/integration/bin/ip tools/macos/integration/bin/fallocate \
            tools/macos/compare-integration-tests.py
          python3 -I -B tools/macos/compare-integration-tests.py --selftest
          # The harness's memory readings (get_resident_memory, memory_maps)
          # on a helper process, in upstream's test environment (venv.sh).
          brew install uv
          tools/macos/integration/venv.sh
          # wick_macos imports upstream's framework, whose framework/defs.py
          # reads the guest artifacts' directory from
          # lib/firecracker/build/current_artifacts (integration-tests.sh
          # writes it); the runner has no guest artifacts: an empty directory.
          mkdir -p "$RUNNER_TEMP/no-guest-artifacts" lib/firecracker/build
          echo "$RUNNER_TEMP/no-guest-artifacts" >lib/firecracker/build/current_artifacts
          build/integration/venv/bin/python tools/macos/integration/memory-selftest.py
          # tools/clean.sh against a live and a dead session, and an orphaned
          # tool loop found, counted and killed (--remove: the runner is clean).
          brew install screen
          tools/macos/integration/clean-selftest.sh --remove
      # How late this runner fires a timer, by kind of wait (macOS coalesces
      # timers; the compat timerfd waits on a NOTE_CRITICAL one, a88980c).
      # It prints and never fails: it is what a timing test's failure below is
      # read against.
      - name: Timer coalescing on this runner (informational)
        # Runs after an earlier step's failure too: each step answers its own question.
        if: (success() || failure()) && steps.build.outcome == 'success'
        run: python3 -I tools/macos/timer-coalescing.py
      # Every test of every crate but the jailer runs; the ones that cannot
      # pass on a runner (they create a VM, and GitHub's macOS runners have no
      # Hypervisor.framework) are listed by name and reason, and the check
      # fails on an unlisted failure, a listed test that passes, or a listed
      # name that is no test. tools/macos/test.sh runs the listed ones on a
      # Mac, and tools/macos/boot-test.sh the scenarios. vmm's binary runs
      # twice: with an endpoint directory of its own, then as a plain
      # `cargo test` runs it, with none given (check-unit-tests.py
      # DEFAULT_MODE), where it must leave no fcnet-test-<pid>.
      # Last in the job, so a unit test's failure does not keep the jailer and
      # harness steps above from running.
      - name: Unit tests of every crate but the jailer (tools/macos/unit-test-differences.txt)
        # Runs after an earlier step's failure too: each step answers its own question.
        if: (success() || failure()) && steps.build.outcome == 'success'
        # Under the watchdog (macos-seatbelt's steps say why): about twice its
        # usual 13 minutes (8 in run 43833851623, and vmm's second run's
        # 274 s), and inside the job's 40.
        run: >-
          python3 -I tools/macos/watchdog.py 1500 --out "$RUNNER_TEMP/unit/watchdog" --
          python3 -I tools/macos/check-unit-tests.py --out "$RUNNER_TEMP/unit" --summary "$GITHUB_STEP_SUMMARY"
      # Every test's result by name (tests.tsv) and each crate's output.
      - name: Upload the unit tests' output
        if: always() && steps.build.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-unit-tests
          path: |
            ${{ runner.temp }}/unit/*.log
            ${{ runner.temp }}/unit/tests.tsv
            ${{ runner.temp }}/unit/watchdog/
          if-no-files-found: warn
          retention-days: 14
      # Every test's result in one format (tools/ci-results.py, results.tsv),
      # for the docs' run claims; a step that did not run gives no rows.
      - name: Results in one format
        if: always() && steps.build.outcome == 'success'
        env:
          WICK_RESULTS_JOB: macos
        run: |
          f="$RUNNER_TEMP/unit/tests.tsv"
          if [ -f "$f" ]; then python3 -I tools/ci-results.py add unit-tsv "$f" --out "$RUNNER_TEMP/results.tsv"; fi
          # The newest run: its directory is named by its time, the glob sorted.
          d=""
          for x in build/jailer-test/*/; do d="$x"; done
          if [ -n "$d" ] && [ -f "$d/summary.txt" ]; then
            python3 -I tools/ci-results.py add summary "$d/summary.txt" --suite tools/macos/jailer-test.py --out "$RUNNER_TEMP/results.tsv"
          fi
          r="$RUNNER_TEMP/results.tsv"
          if [ -f "$r" ]; then python3 -I tools/ci-results.py validate "$r"; else echo "no results: no test step wrote its output"; fi
      - name: Upload the results
        if: always() && steps.build.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: results-macos
          path: ${{ runner.temp }}/results.tsv
          if-no-files-found: ignore
          retention-days: 14
      # Why a test's terminal could not be opened (run 43435331370: posix_openpt
      # failed in 3 children of test_unfiltered_syscalls_are_limited_by_their_rule).
      # XNU prints "reached max_retries" when two openers raced for one minor
      # past vn_open_auth's 10 retries (vfs_vnops.c), and "ptmx_get_ioctl
      # failed due to ptmx_max limit" at the limit (tty_ptmx.c). On macOS 27.2
      # these kernel printfs reach the unified log (32 processes opening
      # terminals at once: 36 posix_openpt failures with errno -6, 36 "reached
      # max_retries error -6" lines); on the runners' 15 and 26 that is
      # unverified, so an empty result there proves nothing. It prints and
      # never decides the job.
      - name: Terminal allocation reports
        if: failure() && steps.build.outcome == 'success'
        run: |
          /usr/bin/log show --last 30m --style compact \
            --predicate 'process == "kernel" AND (eventMessage CONTAINS "max_retries" OR eventMessage CONTAINS "ptmx_max")' || true

  # Seatbelt differs between macOS majors (which system calls' numbers it
  # skips when a rule allows their operation: UNFILTERED_SYSCALLS and
  # MEASURED_MAJORS in overlay/vmm/ext/sandbox.rs), so the sandbox's tests
  # measure every major wick supports (README: macOS 15 and later) on GitHub's
  # runner image of each; a major the table lacks fails naming it and what it
  # measured.
  # tools/macos/boot-test.sh before macOS 26, where vmnet.framework needs root:
  # the script builds as the user and runs the vmnet stage alone through sudo
  # (root's python3, the system's 3.9 here), then gives its results back to
  # the user. macos-latest is macOS 26, where nothing asks for root, so this
  # path runs here, on macOS 15. The runner has no Hypervisor.framework
  # (kern.hv_support 0), so the stage itself fails there, an expected and
  # asserted outcome (were the framework there, the stage must pass); what
  # the job is for is that the root step ran (boot-test.py under sudo
  # reached the stage), that its results are the user's, and that no
  # root-owned file is left in the build directories or the source tree.
  macos-15-root-vmnet:
    runs-on: macos-15
    timeout-minutes: 40
    env:
      MACOSX_DEPLOYMENT_TARGET: "15.0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false
      # Upstream's tag from an earlier run's cache, or fetched (.github/actions/upstream).
      - uses: ./.github/actions/upstream
      - run: tools/setup.sh
      - name: boot-test.sh's vmnet stage as root, before macOS 26
        id: vmnet
        run: |
          sudo python3 --version
          set +e
          tools/macos/boot-test.sh vmnet > "$RUNNER_TEMP/vmnet.log" 2>&1
          rc=$?
          set -e
          cat "$RUNNER_TEMP/vmnet.log"
          grep -q "the vmnet stage runs as root on macOS 15" "$RUNNER_TEMP/vmnet.log"
          grep -q "^== vmnet" "$RUNNER_TEMP/vmnet.log"
          out=$(ls -dt build/boot-test/*/vmnet | head -1)
          cat "$out/summary.txt"
          # kern.hv_support exists only in a kernel built with HYPERVISOR
          # (xnu-12377.1.9 bsd/kern/kern_sysctl.c, `#if HYPERVISOR`): the
          # runner is a virtual Mac, whose kernel (uname -v) has no such oid
          # (CI run 43688550565: "unknown oid"), so no Hypervisor.framework.
          uname -m
          uname -v
          if hv=$(sysctl -n kern.hv_support 2>/dev/null); then
            hvline="kern.hv_support: $hv"
          else
            hvline="kern.hv_support: no such oid (a kernel without HYPERVISOR)"
            hv=0
          fi
          echo "$hvline"
          echo "kern.hv_vmm_present: $(sysctl -n kern.hv_vmm_present 2>/dev/null || echo 'no such oid')"
          if [ "$hv" = 0 ]; then
            # Expected: no Hypervisor.framework, so no VM: the stage fails,
            # and Firecracker says why and exits with its own code (the
            # build's error, patches/0050), not with a panic of its API thread.
            echo "expected: the vmnet stage fails here (no Hypervisor.framework on this runner)"
            # Its results row says so, with this line as the reason.
            echo "xfail=vmnet=$hvline" >> "$GITHUB_OUTPUT"
            if [ "$rc" = 0 ] || ! grep -q "^FAIL  vmnet: " "$out/summary.txt"; then
              echo "the vmnet stage did not fail as it must without Hypervisor.framework (exit $rc)"
              exit 1
            fi
            grep -E "RunWithApiError error: |Firecracker exiting with error" "$out/vmnet.log" || true
            if ! grep -q "RunWithApiError error: Failed to build MicroVM from Json: " "$out/vmnet.log" ||
               ! grep -q "Firecracker exiting with error. exit_code=1$" "$out/vmnet.log"; then
              echo "Firecracker did not end with the build's error and its exit code"
              exit 1
            fi
            if grep -q "panicked" "$out/vmnet.log"; then
              echo "Firecracker panicked:"
              grep -A2 "panicked" "$out/vmnet.log"
              exit 1
            fi
          else
            # With the framework the stage must pass.
            if [ "$rc" != 0 ] || ! grep -q "^PASS  vmnet: " "$out/summary.txt"; then
              echo "the vmnet stage failed with Hypervisor.framework there (exit $rc)"
              exit 1
            fi
          fi
          if [ -n "$(find "$out" ! -user "$(id -u)" -print)" ]; then
            echo "the root step's results are not the user's:"
            find "$out" ! -user "$(id -u)" -print
            exit 1
          fi
          left=$(find . -user 0 -print)
          if [ -n "$left" ]; then
            echo "root-owned files left:"
            echo "$left"
            exit 1
          fi
      # Every test's result in one format (tools/ci-results.py, results.tsv),
      # for the docs' run claims; a step that did not run gives no rows.
      - name: Results in one format
        if: always() && !cancelled()
        env:
          WICK_RESULTS_JOB: macos-15-root-vmnet
          # The stage's expected failure, with the stage step's own
          # kern.hv_support line (empty where the stage must pass).
          XFAIL: ${{ steps.vmnet.outputs.xfail }}
        run: |
          # The newest run: its directory is named by its time, the glob sorted.
          d=""
          for x in build/boot-test/*/vmnet; do d="$x"; done
          if [ -n "$d" ] && [ -f "$d/summary.txt" ]; then
            python3 -I tools/ci-results.py add summary "$d/summary.txt" --suite tools/macos/boot-test.py \
              --out "$RUNNER_TEMP/results.tsv" ${XFAIL:+--xfail "$XFAIL"}
          fi
          r="$RUNNER_TEMP/results.tsv"
          if [ -f "$r" ]; then python3 -I tools/ci-results.py validate "$r"; else echo "no results: no test step wrote its output"; fi
      - name: Upload the results
        if: always() && !cancelled()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: results-macos-15-root-vmnet
          path: ${{ runner.temp }}/results.tsv
          if-no-files-found: ignore
          retention-days: 14
      # The stage's own logs when its step failed (Firecracker's output,
      # the summary): run 43823078930's failure could be read only from the
      # step's greps, the log itself not kept.
      - name: Upload the vmnet stage's logs
        if: failure() && steps.vmnet.conclusion == 'failure'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-15-root-vmnet-logs
          path: build/boot-test/*/vmnet/
          if-no-files-found: warn
          retention-days: 14

  macos-seatbelt:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-26]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      MACOSX_DEPLOYMENT_TARGET: "15.0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false
      # Upstream's tag from an earlier run's cache, or fetched (.github/actions/upstream).
      - uses: ./.github/actions/upstream
      - run: tools/setup.sh
      # Run 43442912128's macos-15 job was cancelled by the job's timeout in
      # the step below, and GitHub kept no log of it. So the tests are built
      # first, and each test command runs under tools/macos/watchdog.py: one
      # still running at its limit (about five times its usual time) has
      # every process it started listed and sampled (each thread's stack)
      # into the log, then is killed, and the step fails with that evidence
      # before the job's timeout.
      # Each test step runs after an earlier test's failure, so that one
      # failure does not hide the rest, but never after a failed checkout,
      # setup or build (steps.build: skipped or failed), whose cause it
      # would bury under failures of its own.
      - name: Build the tests
        id: build
        working-directory: lib/firecracker
        run: cargo test --locked -p vmm --lib --no-run
      - name: Host sandbox tests
        working-directory: lib/firecracker
        run: |
          # Each test's line kept for the results (tee); the step's exit is the tests'.
          set -o pipefail
          sw_vers
          python3 -I ../../tools/macos/watchdog.py 600 --out "$RUNNER_TEMP/watchdog" -- \
            cargo test --locked -p vmm --lib "ext::sandbox" -- \
            --skip ext::sandbox::macos::tests::test_a_denied_call_never_returns_to_its_thread \
            --skip ext::sandbox::macos::tests::test_system_socket_is_not_consulted_for_these \
            2>&1 | tee -a "$RUNNER_TEMP/tests.log"
          # Alone and with --nocapture, so each kind of call's count of kills
          # and of returns is in the log, passing or not: wick's denials rest
          # on Seatbelt's SIGKILL action ending a process inside the call, on
          # every major. Its 600 kills wait on the crash reporter (30 s per 200
          # at load average 30 on macOS 27.2), hence the limit.
          python3 -I ../../tools/macos/watchdog.py 900 --out "$RUNNER_TEMP/watchdog" -- \
            cargo test --locked -p vmm --lib \
            ext::sandbox::macos::tests::test_a_denied_call_never_returns_to_its_thread \
            -- --exact --nocapture 2>&1 | tee -a "$RUNNER_TEMP/tests.log"
          # Which socket families Seatbelt consults system-socket for, alone
          # and with --nocapture so that each major's findings are in the log.
          python3 -I ../../tools/macos/watchdog.py 180 --out "$RUNNER_TEMP/watchdog" -- \
            cargo test --locked -p vmm --lib \
            ext::sandbox::macos::tests::test_system_socket_is_not_consulted_for_these \
            -- --exact --nocapture 2>&1 | tee -a "$RUNNER_TEMP/tests.log"
      # Seatbelt's SIGKILL action alone, with a one-rule profile and no wick
      # code (tools/macos/seatbelt-kill-probe.py): if the test above fails on
      # a major, this tells a change in Seatbelt from a change in wick. Run
      # 43497862443 (87d0328) passed it on macOS 15 and 26. It prints and
      # never decides the job; the test above does.
      - name: Seatbelt SIGKILL action probe
        if: (success() || failure()) && steps.build.outcome == 'success'
        continue-on-error: true
        run: python3 -I tools/macos/seatbelt-kill-probe.py --runs 50
      # The API process's profile test once failed on macos-15 with its child
      # dead before its first marker (c7d32e2); run alone, repeatedly, it
      # shows whether that is intermittent and how often.
      - name: API process profile test, 20 runs
        if: (success() || failure()) && steps.build.outcome == 'success'
        working-directory: lib/firecracker
        run: |
          failed=0
          for i in $(seq 20); do
            python3 -I ../../tools/macos/watchdog.py 120 --out "$RUNNER_TEMP/watchdog" -- \
              cargo test --locked -q -p vmm --lib \
              ext::sandbox::macos::tests::test_api_profile_denies_outside_its_list -- --exact \
              > "$RUNNER_TEMP/api-profile-$i.log" 2>&1 || { failed=$((failed + 1)); cat "$RUNNER_TEMP/api-profile-$i.log"; }
          done
          echo "$failed of 20 runs failed"
          [[ $failed -eq 0 ]]
      # The FIFO relay's stop before the API process's fork reads the
      # kernel's list of thread ids with a proc_info flavor of xnu's private
      # header (PROC_PIDLISTTHREADIDS, overlay/vmm/ext/fifo.rs), and the fork
      # counts threads with another: both run on each major here, where the
      # macos job has one. The test binary is the one the steps above built;
      # one test thread, as check-unit-tests.py runs them; none makes a VM.
      - name: FIFO relay and API process tests
        if: (success() || failure()) && steps.build.outcome == 'success'
        working-directory: lib/firecracker
        run: |
          set -o pipefail
          python3 -I ../../tools/macos/watchdog.py 300 --out "$RUNNER_TEMP/watchdog" -- \
            cargo test --locked -p vmm --lib "ext::fifo" -- --test-threads=1 2>&1 | tee -a "$RUNNER_TEMP/tests.log"
          python3 -I ../../tools/macos/watchdog.py 300 --out "$RUNNER_TEMP/watchdog" -- \
            cargo test --locked -p vmm --lib "ext::api_process" -- --test-threads=1 2>&1 | tee -a "$RUNNER_TEMP/tests.log"
      # What the sandbox denied the test processes (vmm-<hash>), for a
      # failure above: the kernel reports a denied call by its number
      # ("deny(1) syscall-unix 117"), killed or not. All of the lines: the
      # last 300 began after the failing test's process (run 1866e32, whose
      # tests of every number leave one line a process). A test process that
      # a denial killed, but should have had none, is named only here: the
      # kill leaves it no way to print the call.
      # Every test's result in one format (tools/ci-results.py, results.tsv),
      # for the docs' run claims; a step that did not run gives no rows.
      - name: Results in one format
        if: always() && steps.build.outcome == 'success'
        env:
          WICK_RESULTS_JOB: macos-seatbelt (${{ matrix.runner }})
        run: |
          f="$RUNNER_TEMP/tests.log"
          if [ -f "$f" ]; then python3 -I tools/ci-results.py add libtest "$f" --out "$RUNNER_TEMP/results.tsv"; fi
          r="$RUNNER_TEMP/results.tsv"
          if [ -f "$r" ]; then python3 -I tools/ci-results.py validate "$r"; else echo "no results: no test step wrote its output"; fi
      - name: Upload the results
        if: always() && steps.build.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: results-macos-seatbelt-${{ matrix.runner }}
          path: ${{ runner.temp }}/results.tsv
          if-no-files-found: ignore
          retention-days: 14
      - name: Sandbox reports
        if: failure() && steps.build.outcome == 'success'
        run: |
          /usr/bin/log show --last 20m --style compact --predicate 'sender == "Sandbox"' |
            grep -E 'Sandbox: vmm-[0-9a-f]+\(' | grep -v ' allow ' || true
      # Why a test's terminal could not be opened: the macos job's step of the
      # same name says what it looks for, and that an empty result proves nothing.
      - name: Terminal allocation reports
        if: failure() && steps.build.outcome == 'success'
        run: |
          /usr/bin/log show --last 30m --style compact \
            --predicate 'process == "kernel" AND (eventMessage CONTAINS "max_retries" OR eventMessage CONTAINS "ptmx_max")' || true
      # A watchdog's samples with the loaded images, for symbolising by hand.
      - name: Upload the watchdog's samples
        if: failure() && steps.build.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-seatbelt-watchdog-${{ matrix.runner }}
          path: ${{ runner.temp }}/watchdog/
          if-no-files-found: ignore
          retention-days: 14

  # A minute of each fuzz target (fuzz/, CONTRIBUTING.md "Fuzzing"): they
  # build, their seeds pass, and a minute of new inputs finds nothing. Long
  # runs are local (tools/fuzz.sh -t SECONDS). uffd_protocol is macOS only;
  # on Windows the script runs from Git Bash, finds Visual Studio's
  # AddressSanitizer runtime, and leaves hvf_exit out (its host_targets).
  fuzz:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned nightly and cargo-fuzz
        run: |
          rustup toolchain install "$(tools/fuzz.sh --toolchain)" --profile minimal
          cargo install cargo-fuzz --locked --version 0.13.2
      # The decoding modules the targets compile from their sources
      # (fuzz/src/lib.rs: hvf/exit.rs, whp/exit.rs, ...) with their own
      # unit tests, on every host: the WHP run loop's MMIO read bookkeeping
      # (whp_exit::tests), the WHP backend's TSC matching
      # (whp_tscsync::tests), its CPUID x2APIC rule (whp_apicmode::tests),
      # its #GP exit's decode and merge (whp_gp::tests) and KVM's CR4 rule
      # (whp_cr4::tests) are checked on Linux and macOS too.
      - name: The fuzzed modules' unit tests
        id: fuzz_units
        run: cargo test --manifest-path fuzz/Cargo.toml --lib 2>&1 | tee "$RUNNER_TEMP/tests.log"
      # Every test's result in one format (tools/ci-results.py, results.tsv),
      # for the docs' run claims; a step that did not run gives no rows.
      - name: Results in one format
        if: always() && steps.fuzz_units.conclusion != 'skipped' && runner.os != 'Windows'
        env:
          WICK_RESULTS_JOB: fuzz (${{ matrix.runner }})
        run: |
          f="$RUNNER_TEMP/tests.log"
          if [ -f "$f" ]; then python3 -I tools/ci-results.py add libtest "$f" --out "$RUNNER_TEMP/results.tsv"; fi
          r="$RUNNER_TEMP/results.tsv"
          if [ -f "$r" ]; then python3 -I tools/ci-results.py validate "$r"; else echo "no results: no test step wrote its output"; fi
      - name: Upload the results
        if: always() && steps.fuzz_units.conclusion != 'skipped' && runner.os != 'Windows'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: results-fuzz-${{ matrix.runner }}
          path: ${{ runner.temp }}/results.tsv
          if-no-files-found: ignore
          retention-days: 14
      - name: Fuzz each target for 60 seconds
        run: tools/fuzz.sh -t 60
      - name: Upload the inputs that failed
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-artifacts-${{ runner.os }}
          path: fuzz/artifacts/
          if-no-files-found: ignore
          retention-days: 14

  # Windows: the POSIX layer and the crates built over it, tested natively,
  # and the firecracker binary on the WHP backend.
  windows:
    runs-on: windows-latest
    # The unit-test step builds every package's tests (vmm's among them).
    timeout-minutes: 60
    # Whether the kit was uploaded: windows-guest runs on it.
    outputs:
      kit: ${{ steps.kit.outcome }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false
      # The machine on record before anything can fail: windows-latest is not
      # one machine (run 43292883636's was an AMD EPYC 9V45; the runs before
      # it printed none), and what the unit tests and the WHP step measure
      # depends on its processor and on WHP being there.
      - name: Host
        shell: pwsh
        run: |
          Get-CimInstance Win32_Processor | Format-List Name,Manufacturer,NumberOfCores,NumberOfLogicalProcessors
          Get-CimInstance Win32_OperatingSystem | Format-List Caption,Version,BuildNumber
          Get-CimInstance Win32_ComputerSystem | Format-List HypervisorPresent
          try {
            Get-WindowsOptionalFeature -Online -FeatureName HypervisorPlatform -ErrorAction Stop | Format-List FeatureName,State
          } catch {
            "HypervisorPlatform: not read ($($_.Exception.Message))"
          }
          if (Test-Path "$env:SystemRoot\System32\WinHvPlatform.dll") { "WinHvPlatform.dll: present" } else { "WinHvPlatform.dll: absent" }
      # Upstream's tag from an earlier run's cache, or fetched (.github/actions/upstream).
      - uses: ./.github/actions/upstream
      # A failed fetch of upstream is said as what it is, in one line, by the
      # step before (an outage of github.com's upstream repository, not a wick
      # failure: run 43783880314, "The requested URL returned error: 503"),
      # and this step does not run. No retry.
      - name: Set up upstream and the patch series
        id: setup
        run: tools/setup.sh
      # Upstream tests put sockets and files under /tmp, which Windows
      # resolves to \tmp on the current drive.
      - name: Create \tmp on the working drive
        shell: pwsh
        run: New-Item -ItemType Directory -Force -Path "$((Get-Location).Drive.Name):\tmp" | Out-Null
      - name: Compatibility crate tests
        working-directory: lib/firecracker
        run: |
          for c in os std libc polling vmm-sys-util memfd event-manager micro-http userfaultfd; do
            cargo test --locked --manifest-path "../../crates/compat/$c/Cargo.toml"
          done
          # These two make several partitions with guest memory in one
          # process; they run in the WHP step, each in a process of its own
          # (on the runner every map after one refused beside another
          # partition's memory failed, run 43277608081).
          cargo test --locked --manifest-path ../../crates/compat/kvm-ioctls/Cargo.toml -- \
            --skip whp::vm::tests::test_vms_one_after_another_map_their_memory \
            --skip whp::vm::tests::test_one_partition_of_a_process_maps_memory
          # The gdb stub's guest debugging and connection, which only
          # Firecracker's gdb feature builds (whp/debug.rs checks that a build
          # without it makes the partition as before).
          cargo test --locked --manifest-path ../../crates/compat/kvm-ioctls/Cargo.toml --features gdb -- \
            whp::debug
          cargo test --locked --manifest-path ../../crates/compat/os/Cargo.toml --features gdbstub -- gdb
          cargo test --locked --manifest-path ../../crates/compat/vm-memory/Cargo.toml \
            --features backend-mmap,backend-bitmap,backend-atomic
          cargo test --locked --manifest-path ../../crates/compat/vhost/Cargo.toml \
            --features vhost-user-frontend,vhost-user-backend
      # Every step from here to the kit's upload runs whatever failed before
      # it (success() || failure()), as the steps after the upload do: a
      # failed crate test keeps the job red and no longer skips the build,
      # the kit and so windows-guest, which needs the kit. Runs 43521200989
      # and 43524342863 (one failed crate test each) built no kit and booted
      # no guest. But none runs once the setup has failed (no upstream, no
      # series: nothing to build or test), and the steps that run the
      # release firecracker.exe none once its build has failed: the first
      # cause stays the one red step (run 43783880314: setup's fetch of
      # upstream failed, a 503, and some 100 later errors buried it).
      # The boot test's own helpers (serial-console protocol, vsock, network
      # switch) against stand-ins, in Windows PowerShell 5.1 as users run it.
      # Its boot stages run on the WHP PC, with its guest image.
      - name: Boot test harness self-test
        if: (success() || failure()) && steps.setup.outcome == 'success'
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tools\windows\boot-test.ps1 -SelfTest
      # Upstream's integration tests need WHP (tools/windows/integration-tests.ps1
      # runs them on Windows hardware); their harness's AF_UNIX sockets,
      # network host side and host tools run here.
      - name: Integration test harness (without a VM)
        if: (success() || failure()) && steps.setup.outcome == 'success'
        run: |
          # upstream's pin (tools/devctr/poetry.lock)
          python -m pip install --quiet psutil==6.1.1
          python -I tools/windows/integration/selftest.py
          python -m py_compile tools/windows/integration/*.py tools/windows/integration/netns_site/*.py
          python -m py_compile tools/windows/vmm-memory-record.py
          python -I tools/windows/vmm-memory-record.py --selftest
          python -I tools/windows/check-unit-tests.py --selftest
      # aws-lc-sys assembles its x86_64 code with NASM in release builds
      # (built from source rather than with its prebuilt objects).
      - name: Install NASM
        if: (success() || failure()) && steps.setup.outcome == 'success'
        shell: pwsh
        run: |
          choco install nasm -y --no-progress
          "$env:ProgramFiles\NASM" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
      - name: Build firecracker (WHP backend)
        if: (success() || failure()) && steps.setup.outcome == 'success'
        id: build
        working-directory: lib/firecracker
        run: cargo build --locked -p firecracker --release
      - name: Smoke-test the binary
        if: (success() || failure()) && steps.build.outcome == 'success'
        working-directory: lib/firecracker
        run: build/cargo_target/release/firecracker.exe --version
      # The Linux and macOS jobs' check, through the harness's AF_UNIX
      # sockets: Windows has no /dev/nitro_enclaves either, and the start is
      # refused with Windows' error for the missing path (os error 3).
      - name: Nitro Enclave refused without the device
        if: (success() || failure()) && steps.build.outcome == 'success'
        run: python -I tools/windows/enclave-refusal-test.py lib/firecracker/build/cargo_target/release/firecracker.exe
      # The boot test's diff stage merges snapshots with it.
      - name: Build snapshot-editor
        if: (success() || failure()) && steps.setup.outcome == 'success'
        working-directory: lib/firecracker
        run: cargo build --locked -p snapshot-editor --release
      # Upstream's other tools, which its integration tests run
      # (tools/windows/integration-tests.ps1).
      - name: Build rebase-snap, cpu-template-helper, seccompiler
        if: (success() || failure()) && steps.setup.outcome == 'success'
        working-directory: lib/firecracker
        run: cargo build --locked -p rebase-snap -p cpu-template-helper -p seccompiler --release
      # The two rebase tools' tests. The five skipped write their diff file
      # without marking it sparse (holes by set_len or seeks, which NTFS
      # allocates as zeros); both tools refuse such a file on Windows rather
      # than copy its zeros over the base (patches/0036), so these fail
      # with that refusal.
      - name: rebase-snap and snapshot-editor tests
        if: (success() || failure()) && steps.setup.outcome == 'success'
        working-directory: lib/firecracker
        run: |
          cargo test --locked -p rebase-snap -p snapshot-editor -- --exact \
            --skip tests::test_rebase \
            --skip tests::test_rebase_corner_cases \
            --skip edit_memory::tests::test_rebase \
            --skip edit_memory::tests::test_rebase_empty_diff \
            --skip edit_memory::tests::test_rebase_full_diff
      # Upstream's jailer with the Windows backend (overlay/jailer/platform):
      # its tests (tokens, job limits) and the binary.
      - name: Jailer tests and build
        if: (success() || failure()) && steps.setup.outcome == 'success'
        working-directory: lib/firecracker
        run: |
          cargo test --locked -p jailer
          cargo build --locked -p jailer --release
      # The boot test's uffd stage serves a snapshot's pages with it.
      - name: Build the uffd page fault handler example
        if: (success() || failure()) && steps.setup.outcome == 'success'
        working-directory: lib/firecracker
        run: cargo build --locked -p firecracker --example uffd_on_demand_handler --release
      # The boot test's vhost-user stage serves a drive with it. The target
      # directory absolute: a relative one stays in every path cargo gives
      # the linker as ..\..\, which on a PC took link.exe past 260
      # characters (LNK1104).
      - name: Build the vhost-user-blk test backend
        if: (success() || failure()) && steps.setup.outcome == 'success'
        working-directory: tools/vhost-user-blk
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/lib/firecracker/build/vhost-user-blk
        run: cargo build --release --locked
      # The host capability probe (tools/windows/winprobe.c), built with the
      # same MSVC toolchain the binary uses.
      - name: Build winprobe
        if: (success() || failure()) && steps.setup.outcome == 'success'
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          cmd /c "`"$vs\VC\Auxiliary\Build\vcvars64.bat`" >nul && cl /nologo /W3 /O2 /D_CRT_SECURE_NO_WARNINGS tools\windows\winprobe.c advapi32.lib ws2_32.lib userenv.lib /Fe:winprobe.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      # The jailer test's probe and the memory-partition probe, so the kit
      # runs on a PC without Rust (tools/windows/jailer-test.ps1 uses the
      # built jail-probe.exe next to it).
      - name: Build the probes
        if: (success() || failure()) && steps.setup.outcome == 'success'
        run: |
          rustc --edition 2021 -O -o tools/windows/jail-probe.exe tools/windows/jail-probe.rs
          # The operator's tool for a parent cgroup, and its own tests (how
          # it reads its arguments), which need nothing of the host.
          rustc --edition 2021 -O -o tools/windows/jail-parent.exe tools/windows/jail-parent.rs
          rustc --edition 2021 --test -o "$RUNNER_TEMP/jail-parent-test.exe" tools/windows/jail-parent.rs
          "$RUNNER_TEMP/jail-parent-test.exe"
          rustc --edition 2021 -O -o tools/windows/memory-partition-probe.exe tools/windows/memory-partition-probe.rs
      # The x2APIC record build, for boot-test.ps1 x2apic (the windows-guest
      # job and a PC): a release Firecracker with kvm-ioctls'
      # whp-x2apic-record feature, whose partitions are x2APICs on AMD hosts
      # as option E makes them, before the product turns them on
      # (vm::X2APIC_PARTITIONS). In a target directory of its own, so that
      # the kit's product binaries are left as they are; kvm-ioctls named by
      # its package id, as the whp-trace build names it.
      - name: Build the x2APIC record Firecracker
        if: (success() || failure()) && steps.setup.outcome == 'success'
        working-directory: lib/firecracker
        run: |
          kvm=$(cargo pkgid --locked --manifest-path ../../crates/compat/kvm-ioctls/Cargo.toml)
          CARGO_TARGET_DIR=build/x2apic cargo build --locked --release -p firecracker -p "$kvm" --features kvm-ioctls/whp-x2apic-record
      # Firecracker's gdb stub (upstream's test_gdb builds it), for
      # boot-test.ps1 gdb on a WHP machine. Built right before the kit's
      # upload, after every step before it that builds the workspace's
      # debug binaries: the debug profile's firecracker.exe is the one path,
      # and such a build replaces a gdb build with a plain one, as run
      # 43282663307's kit showed (no gdb_socket_path in its debug
      # firecracker.exe). The unit-test step, which builds them, runs after
      # the upload, so it replaces only the copy on the runner. The check
      # fails the job if the uploaded binary is not the gdb build.
      - name: Build firecracker with the gdb feature
        if: (success() || failure()) && steps.setup.outcome == 'success'
        working-directory: lib/firecracker
        run: |
          cargo build --locked -p firecracker --features gdb
          grep -c -a gdb_socket_path build/cargo_target/debug/firecracker.exe \
            || { echo "::error::debug firecracker.exe has no gdb_socket_path: not the gdb build"; exit 1; }
      # No product binary of the kit is a build with a record-only feature
      # of kvm-ioctls (whp-trace, whp-x2apic-record), and the x2APIC record
      # build is one, which shows the check finds its line.
      - name: No record-only feature in the kit's product binaries
        if: (success() || failure()) && steps.build.outcome == 'success'
        run: |
          r=lib/firecracker/build/cargo_target/release
          tools/check-record-features.sh "$r/firecracker.exe" "$r/jailer.exe" "$r/snapshot-editor.exe" "$r/rebase-snap.exe" \
            lib/firecracker/build/cargo_target/debug/firecracker.exe \
            --has whp-x2apic-record lib/firecracker/build/x2apic/release/firecracker.exe
      # For validation on Windows hardware with WHP (tools/windows/boot-test.ps1,
      # jailer-test.ps1): everything the stages need, at the paths they look in.
      - name: Upload Windows binaries
        if: (success() || failure()) && steps.build.outcome == 'success'
        id: kit
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wick-windows-x86_64-${{ github.sha }}
          path: |
            lib/firecracker/build/cargo_target/release/firecracker.exe
            lib/firecracker/build/cargo_target/release/firecracker.pdb
            lib/firecracker/build/cargo_target/release/snapshot-editor.exe
