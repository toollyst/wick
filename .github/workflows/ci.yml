          # WHP register holds: KVM_GET_MSRS and KVM_SET_MSRS end there
          # (asserted), and whether a guest's RDMSR comes to the backend.
          alone whp::vcpu::fpu_tests::test_what_a_cpu_template_changes_on_record
          # The vCPUs' TSCs (TSCSYNC lines), for KVM's TSC matching: whether
          # a TSC runs before a first run, the skew after writes of one value
          # 300 us apart straight to WHP and through KVM_SET_MSRS, what
          # suspending partition time returns and costs the TSC, the
          # reference time and the APIC timer, and a suspension while a vCPU
          # runs. Then the matching asserted (TSCMATCH lines): a boot's and a
          # restore's writes give both vCPUs one offset, through two more
          # save and restore rounds into new VMs, and a host write while a
          # vCPU runs fails.
          alone whp::vcpu::fpu_tests::test_tsc_matching_and_partition_time_on_record
          # HOSTWARP, the control for the guests' TSC warp check: its loop
          # natively between two of this host's logical CPUs (0 and 1, 0
          # and the middle one, 0 and the last), five rounds each: warps,
          # the most back, and the offset between the two TSCs from the
          # least step at a hand-over each way. Printed only.
          alone whp::vcpu::fpu_tests::test_the_hosts_tscs_against_each_other_on_record
          alone whp::vcpu::fpu_tests::test_restored_vcpus_take_one_tsc_offset_as_kvm
          # The MSRs a guest reaches that WHP hands the backend, answered as
          # KVM v6.1 answers a Firecracker guest (MSRTEST lines: a guest's
          # RDMSR and WRMSR of each, its value or #GP(0)); and those KVM
          # keeps for each vCPU, listed, read and written through
          # KVM_GET_MSRS and KVM_SET_MSRS, carried by a restore, refused as
          # KVM refuses.
          alone whp::vcpu::fpu_tests::test_the_msrs_a_guest_reaches_are_answered_as_kvm
          alone whp::vcpu::fpu_tests::test_the_msrs_kvm_keeps_restore_as_kvm
          # TSC_ADJUST offered to the guest as KVM offers it (TSCADJREC
          # lines): the CPUID bit in the host, the table and the guest; the
          # guest's RDMSR/WRMSR of 0x3b and how far a write moves its TSC;
          # the guest's WRMSR of IA32_TSC and TSC_ADJUST after it. Asserted
          # where the vCPU keeps TSC_ADJUST: both writes move the TSC
          # exactly (read with partition time suspended); printed: how far
          # the TSCs fell behind the host's across the write.
          alone whp::vcpu::fpu_tests::test_tsc_adjust_offered_to_the_guest_on_record
          # WHP's triggers for an MSI route (TRIGREC lines), the equivalent of
          # KVM's MSI irqfd injected in the signaller's context: created for
          # the MSI's interrupt control, signalled from another thread; the
          # latency of a trigger, of an irqfd write its consumer injects in
          # the writer's thread, of the irqfd watcher (an irqfd without its
          # consumer) and of a direct inject_msi, with the guest spinning
          # and halted, what WHP returns for an MSI to an APIC ID no vCPU
          # has, and the vCPU threads' runs by exit reason; coalescing of
          # bursts and of spaced signals; WHvUpdateTriggerParameters on a
          # route change and racing signals; WHvDeleteTrigger. Record only:
          # the backend has no trigger.
          alone whp::vcpu::fpu_tests::test_msi_triggers_against_the_irqfd_watcher_on_record
          k=../../crates/compat/libc/Cargo.toml
          alone windows_linux::tests::test_unix_bind_of_each_path_form_on_record
          # Section memory against memory.max (SECTREC lines, the plan's S0):
          # a child in a job of 1 GiB; what SEC_COMMIT and SEC_RESERVE
          # sections take of the host's commit, the job's and the process's;
          # a charge page's cost and the job's refusal of them; a memfd view
          # opened a page at a time, seen from another view and another
          # process; the jailer's poll of a jail laid out as Firecracker's
          # with vhost-user and a uffd restore: each part's time, its share
          # of a CPU at a poll a millisecond, what it counts, and whether
          # this process is elevated and given the kernel's object
          # addresses (CI's runner; the PC runs it unelevated, and elevated
          # when the user starts it so); how fast a process takes section
          # commit and RAM, and what cheap signs of new section memory cost
          # the jailer a poll, whether SharedCommitUsage charges a section's
          # commit to a process, and whether a pagefile quota can be set and
          # refuses a section (SECTREC-e).
          alone windows_sectrec::test_section_memory_and_a_charge_for_it_on_record
          # SECTREC-h: a SEC_RESERVE section's page committed through one
          # of two views, no access, and what the other shows; committed
          # through the other; decommitted through a view; for the
          # userfaultfd restore's section made SEC_RESERVE (S1).
          alone windows_sectrec::test_a_reserved_section_committed_through_one_view_on_record
          # UFFDCHUNK b-d, for the W2 plan's "Discarded userfaultfd pages":
          # a charge page's decommit (its time, what it gives back of the
          # process's commit and the job's); DiscardVirtualMemory through a
          # SEC_RESERVE section's alias (what stays resident and committed);
          # 1 GiB as one section against 512 chunk sections over
          # placeholders (time, the host's commit, pools, handles) and 100
          # swaps of a chunk. Its guest's side (a) is in the WHP step.
          alone windows_sectrec::test_chunked_sections_and_a_charge_decommit_on_record
          # RECLAIMREC, the reclaim at the memory limit's cost (it runs only
          # there): in a child under a job limit with no room left, partly
          # discarded chunks moved into new sections while a fill goes on
          # past the limit and a host thread reads them: the chunks moved,
          # the live pages each copied and its microseconds, the reads that
          # waited for a move, and the private and section commit before and
          # after. RECLAIMSTACK: how deep the reclaim's own thread goes, of
          # the stack committed for it, and the faulting thread's stack.
          alone wick_uffd::tests::test_the_reclaims_cost_on_record
          alone wick_uffd::tests::test_the_reclaimers_stack_on_record
          # VIEWCHARGE: what a section view's map takes of the process's
          # commit (its page tables), and at the job's limit with 0 to 4096
          # KiB of room; MOVEROOM: the room the reclaim's move needs there;
          # STACKZERO: how a thread whose stack must grow at the limit ends,
          # against the control and a true overflow.
          alone wick_uffd::tests::test_what_a_view_mapping_charges_on_record
          alone wick_uffd::tests::test_the_room_a_move_needs_on_record
          alone wick_uffd::tests::test_a_stack_that_grows_at_the_limit_on_record
          # What Windows' cycle counters count (CPUCYCLEREC lines), for the
          # CPU clocks: a PC read the thread's QueryThreadCycleTime at 1.32 x
          # the TSC while spinning and the process's at 1.01 x. The thread's
          # through both handles, the process's, GetThreadTimes and
          # GetProcessTimes, idle, loaded, read by another thread, asleep.
          alone windows_time::tests::test_cpu_cycle_counters_on_record
          alone windows_fd::tests::test_non_blocking_pipe_writes_on_record
          # A pipe's maker gets no identity of Firecracker's: the two tests
          # pass in the crates' own steps, which do not print a passing
          # test's lines; here for their SQOSTEST lines, what
          # ImpersonateNamedPipeClient answered for std's own open (the
          # control) and for ours (a refusal, or an anonymous token).
          k=../../crates/compat/os/Cargo.toml
          alone fifo::windows::tests::test_a_pipe_opened_again_gives_its_maker_no_identity
          k=../../crates/compat/std/Cargo.toml
          alone tests::test_a_pipe_opened_by_path_gives_its_maker_no_identity
          # NOFILEREC, for the jailer's no-file bound: the handles each kind
          # of descriptor wick's POSIX layer makes adds, by object type
          # (NtQueryInformationProcess ProcessHandleInformation); that read's
          # cost at this process's count and 10,000 and 100,000 handles
          # more; whether it and ProcessHandleCount read another process with
          # the jailer's access; and whether this runner's process is
          # elevated (the PC runs it unelevated). boot-test.ps1 prints the
          # handles of each stage's Firecracker and API process at their end
          # and the most each held (NOFILEREC lines after its summary).
          k=../../crates/compat/vmm-sys-util/Cargo.toml
          alone windows::nofilerec::test_the_handles_each_descriptor_makes_on_record
          t=platform::windows::net::tests::test_descriptor_check_cost_on_record
          out=$(cargo test --locked -p vmm --lib -- \
            --include-ignored --exact --nocapture --test-threads=1 "$t" 2>&1) || true
          printf '%s\n' "$out"
          if ! grep -q "test result: ok. 1 passed" <<<"$out"; then
            echo "::error::$t did not pass alone"
            failed=1
          fi
          # The jailer's two records of nested Job Objects (no WHP in them),
          # for the design of --parent-cgroup: whether a jail's job, which
          # sets UI limits, nests under a parent job (Microsoft Learn says
          # no; Windows Server 2025 build 26100 did, run 43359525691: the
          # line names the build), and what nesting does (NESTTEST lines).
          # With them, the hugetlb page sizes test for its HUGETLBTEST line:
          # whether this runner's processor has 1 GiB pages, which decides
          # which of the test's two 1GB halves ran.
          # Then --parent-cgroup itself (platform::parent), each test alone
          # as it makes named jobs and processes: a parent's memory limit
          # bounds two jails together; a jailer's handle keeps the parent
          # and its limit when the tool is gone; a jail's processors and CPU
          # rate under a parent are Linux's by cgroup version (v1 refuses
          # what is outside the parent's, v2 takes what is common), nothing
          # narrowed without a word; a job of the parent's name labelled
          # below medium integrity, as a jailed process's would be, is not
          # joined; a parent of two levels holds a jail by each level's
          # limits; a thread with a jail's token neither opens the private
          # namespace the parents' jobs are named in, nor makes one of its
          # boundary, nor opens a parent's job (and what that token may do
          # in the session's own namespace, printed; and a namespace
          # outlasts its maker's handle while a second process, the test
          # program started again, has it open, and is gone with the last
          # handle: asserted since run 43388798760). They assert the
          # jailer's rules and print what Windows answered (PARENTTEST
          # lines). A jail's job under a parent has a name and, beside it,
          # what the jail was asked for, which the tool reads when a level
          # above is written. And memory.max's count of sections
          # (platform::commit), alone for its COMMITPOLL line: how long after
          # a section past the limit was given the jail ended with 137, in
          # its parts; the poll's timer's intervals on its 1 ms schedule,
          # with Windows' periodic timer as the control (COMMITTIMER); and
          # what ending a jail costs and lets through, 50 rounds of each
          # kind (TERMREC: TerminateJobObject alone and after a freeze, of a
          # suspended process and of one committing as fast as it can).
          for t in test_a_jails_job_under_a_parent_job_on_record test_nested_jobs_on_record \
              test_a_section_past_the_limit_ends_the_jail_with_137 \
              test_the_poll_timer_ticks_about_every_millisecond \
              test_terminating_a_jail_on_record \
              test_hugetlb_page_sizes_are_linuxs \
              test_a_parent_bounds_its_jails_together test_a_parent_lasts_while_a_jail_holds_it \
              test_a_parent_with_a_memory_limit_is_refused \
              test_a_jail_under_a_parent_has_linuxs_cpus_and_rate \
              test_a_parent_made_below_medium_integrity_is_refused \
              test_a_parent_of_several_levels_bounds_by_each \
              test_a_jails_token_does_not_reach_a_parents_name \
              test_a_jails_job_under_a_parent_has_a_name_and_what_it_was_asked; do
            out=$(cargo test --locked -p jailer -- \
              --include-ignored --nocapture --test-threads=1 "$t" 2>&1) || true
            printf '%s\n' "$out"
            if ! grep -q "test result: ok. 1 passed" <<<"$out"; then
              echo "::error::$t did not pass alone"
              failed=1
            fi
          done
          # The operator's tool for a parent cgroup against real jobs: a
          # write to a level that is there is read back from every job below
          # it (TOOLTEST lines), with the test of how it reads its arguments;
          # and the same writes while a process runs in each jail's job, put
          # in its jobs from the top level down (TOOLTEST live lines: what
          # Windows answers each write of a job that has jobs nested under
          # it, each job's cap, each process's processors and CPU time).
          # Built in this step: the probes' build step does not run once a
          # step before it failed, and this one does (run 43397419784: the
          # harness step failed, and this step found no jail-parent-test.exe).
          if ! rustc --edition 2021 --test -o "$RUNNER_TEMP/jail-parent-test.exe" ../../tools/windows/jail-parent.rs; then
            echo "::error::jail-parent's tests did not build"
            failed=1
          fi
          out=$("$RUNNER_TEMP/jail-parent-test.exe" --include-ignored --nocapture --test-threads=1 2>&1) || true
          printf '%s\n' "$out"
          # Every test of the binary must pass (it holds the shared value
          # tests too, so their number is not fixed here), and the tests
          # against real jobs must have printed their lines.
          if ! grep -Eq "test result: ok\. [1-9][0-9]* passed; 0 failed" <<<"$out" \
              || ! grep -q "^TOOLTEST a level at 5000" <<<"$out" \
              || ! grep -q "^TOOLTEST live: the processes ended" <<<"$out"; then
            echo "::error::jail-parent's tests did not pass"
            failed=1
          fi
          # What Firecracker's own memory besides its guest's is made of with
          # 1, 2 and 16 vCPUs (VMMMEM lines), against upstream's tests' 5 MiB
          # for it: a microVM whose guest is the script's own `hlt` loop.
          # The release build has no PDB of Firecracker's own functions (run
          # 43377614564 named its frames by the nearest symbol of std's):
          # the same binary linked again with the linker's map, which names
          # them by address. `-MAP`, not `/MAP`: Git Bash rewrites an
          # argument that looks like a path.
          map="$(cygpath -w "$RUNNER_TEMP")\\firecracker.map"
          if ! cargo rustc --locked -p firecracker --release --bin firecracker -- -C "link-arg=-MAP:$map"; then
            echo "::error::firecracker did not link with a map"
            failed=1
          fi
          if ! python -I ../../tools/windows/vmm-memory-record.py --map "$RUNNER_TEMP/firecracker.map" \
              build/cargo_target/release/firecracker.exe; then
            echo "::error::vmm-memory-record.py did not finish"
            failed=1
          fi
          # The same with a guest whose vCPUs all run: upstream's CI kernel
          # and root file system (the linux-boot job's, from the same
          # bucket), a network interface, the guest's shell on the serial
          # console. Besides the VMMMEM lines, each thread's stack and the
          # return addresses on the deepest stacks (VMMSTACK lines), named
          # from the map: what a running vCPU's stack is made of; and which
          # allocations grow with each vCPU (VMMGROW lines). A Linux guest
          # boots on the runner (run 43377614564); should one not, the
          # lines say how far it came and the step notes it with a warning.
          if ! python -I ../../tools/windows/vmm-memory-record.py --map "$RUNNER_TEMP/firecracker.map" \
              --boot "$RUNNER_TEMP/vmmmem-guest" \
              build/cargo_target/release/firecracker.exe 1 2 16; then
            echo "::warning::vmm-memory-record.py --boot: no record of a booted guest on this runner"
          fi
          # What the host's reads of guest memory for a snapshot commit: a
          # 1 GiB guest that touched 64 MiB, after a full and a diff
          # snapshot, and a restore from the full snapshot's file (VMMSNAP
          # lines; GUESTSNAP in the linux-boot job). Today libc commits the
          # lazy pages of every buffer a write takes, and a private file
          # mapping is read in whole: the record prints what that costs
          # before it is changed.
          if ! python -I ../../tools/windows/vmm-memory-record.py --snapshot "$RUNNER_TEMP/vmmmem-guest" \
              build/cargo_target/release/firecracker.exe; then
            echo "::warning::vmm-memory-record.py --snapshot: no record of a snapshot on this runner"
          fi
          # Which WHP call leaves every vCPU thread of that booted guest 48
          # to 52 KiB deep (run 43397419784's VMMSTACK lines: the stale
          # frames of an exception WinHvPlatform throws and catches within
          # WHvSetVirtualProcessorRegisters, called from the run loop; no
          # step of the record test above commits more than 24 KiB): a
          # debug build with kvm-ioctls' whp-trace feature, whose backend
          # prints each WHP call during which its thread's committed stack
          # grew by 16 KiB or more (WHPTRACE lines, in the record), booted
          # once with 1 vCPU. In a target directory of its own, so that the
          # binaries above are left as they are. kvm-ioctls is named by its
          # package id: the upstream crate of the same name and version is
          # in the lock file too.
          kvm=$(cargo pkgid --locked --manifest-path ../../crates/compat/kvm-ioctls/Cargo.toml)
          if CARGO_TARGET_DIR=build/whp-trace cargo build --locked -p firecracker -p "$kvm" --features kvm-ioctls/whp-trace; then
            if ! python -I ../../tools/windows/vmm-memory-record.py --boot "$RUNNER_TEMP/vmmmem-guest" \
                build/whp-trace/debug/firecracker.exe 1; then
              echo "::warning::vmm-memory-record.py --boot with the whp-trace build: no record of a booted guest"
            fi
          else
            echo "::error::firecracker did not build with kvm-ioctls' whp-trace feature"
            failed=1
          fi
          exit $failed
      # A process the stack filter ended with 137 (its stack could not grow
      # at the job's limit: MOVEUNDERVCPU's vCPU thread in runs 43800980377
      # and 43808974288) printed its return addresses (STACK137FRAMES, as
      # offsets in its executable, or in the system DLL a frame is in):
      # named here with cdb against the test executable the run's "Running"
      # line names and its pdb, and a DLL's against the runner's own copy and
      # Microsoft's public symbols; the executable and pdb are kept as an
      # artifact for a debugger elsewhere. Only prints; it fails nothing.
      - name: Name the frames of a stack that could not grow
        if: (success() || failure()) && steps.setup.outcome == 'success'
        working-directory: lib/firecracker
        run: |
          cdb="/c/Program Files (x86)/Windows Kits/10/Debuggers/x64/cdb.exe"
          mkdir -p "$RUNNER_TEMP/whp-frames"
          for f in "$RUNNER_TEMP"/whp-logs/*.log; do
            [ -e "$f" ] && grep -q 'STACK137FRAMES' "$f" || continue
            exe=$(sed -n 's/.*Running unittests [^(]*(\(.*\.exe\)).*/\1/p' "$f" | tail -1 | tr '\\' /)
            echo "== $f: $(grep -m1 'stack could not grow' "$f")"
            echo "executable: $exe"
            [ -n "$exe" ] && [ -f "$exe" ] || { echo "::warning::$f: no test executable named"; continue; }
            cp "$exe" "${exe%.exe}.pdb" "$RUNNER_TEMP/whp-frames/" 2>/dev/null || true
            module=$(basename "$exe" .exe | tr - _)
            cmds=$(grep -o 'STACK137FRAMES [0-9]* image+0x[0-9a-f]*' "$f" | awk -v m="$module" '{sub("image", m, $3); printf "ln %s; ", $3}')
            if [ -x "$cdb" ]; then
              "$cdb" -z "$exe" -y "$(dirname "$exe")" -c "${cmds}q" 2>&1 | grep '^(' || true
            else
              echo "no cdb on this runner: the executable and its pdb are in the whp-frames artifact"
            fi
            # A frame in a system DLL is printed as <dll>+<offset>
            # (windows_mm::module_of): named with cdb against this host's
            # own copy of that DLL and Microsoft's public symbols.
            grep 'STACK137FRAMES' "$f" | grep -v ' image+0x' || true
            # cdb names a frame from the public pdb it fetched, or, if the
            # fetch failed, from the DLL's exports alone (its `lm` line says
            # "export symbols" where it says "pdb symbols": both seen on
            # fc-win, the second with the server unreachable), which is
            # said as "no symbols fetched"; so is a frame cdb named nothing for.
            grep -o 'STACK137FRAMES [0-9]* [A-Za-z0-9_.-]*\.[dD][lL][lL]+0x[0-9a-f]*' "$f" | awk '{print $3}' | sort -u | while read -r frame; do
              dll=${frame%%+*}
              if [ ! -x "$cdb" ]; then echo "$frame: no cdb on this runner: not named"; continue; fi
              if [ ! -f "/c/Windows/System32/$dll" ]; then echo "$frame: no C:/Windows/System32/$dll on this runner: not named"; continue; fi
              out=$("$cdb" -z "C:/Windows/System32/$dll" -y "srv*$RUNNER_TEMP/sym*https://msdl.microsoft.com/download/symbols" \
                -c ".reload /f; lm v m ${dll%.*}; ln ${dll%.*}+${frame#*+}; q" 2>&1) || true
              named=$(printf '%s\n' "$out" | grep '^(' | sed "s|^|$frame: |")
              if [ -z "$named" ]; then
                echo "$frame: no symbols fetched: cdb named nothing"
              elif printf '%s\n' "$out" | grep -q '(pdb symbols)'; then
                printf '%s\n' "$named"
              else
                printf '%s\n' "$named"
                echo "$frame: no symbols fetched: the name above is the nearest export's"
              fi
            done
          done
      - name: Keep the executables of a stack that could not grow
        if: (success() || failure()) && steps.setup.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: whp-frames
          path: ${{ runner.temp }}/whp-frames/*
          if-no-files-found: ignore
          retention-days: 14
      # wick-os's standard input on a console (a hidden console of its own,
      # made for a child process): ignored in the crate step above so that a
      # runner without a console cannot cost the kit; run alone here, after
      # the upload, and must pass.
      - name: Standard input on a console
        if: (success() || failure()) && steps.setup.outcome == 'success'
        working-directory: lib/firecracker
        run: |
          cargo test --locked --manifest-path ../../crates/compat/os/Cargo.toml -- \
            --include-ignored --exact --nocapture \
            windows::stdio::tests::test_a_console_without_characters_reads_as_eagain \
            2>&1 | tee "$RUNNER_TEMP/stdio-console.log"
          test "${PIPESTATUS[0]}" -eq 0
          grep -q "1 passed" "$RUNNER_TEMP/stdio-console.log"

  # The Windows scenario tests with a guest, on the hosted runner: it has
  # WHP and boots Linux (run 43377614564, the windows job's memory record).
  # tools/windows/boot-test.ps1 and jailer-test.ps1 run as on a PC, from the
  # kit the windows job uploaded (no second build), in Windows PowerShell
  # 5.1, each script collecting its own stages' PASS and FAIL. Every step
  # runs whatever failed before it, and a failed stage fails the job; each
  # script's logs are uploaded. The runner is elevated, Windows Server, and
  # has no interactive desktop: the jailer unelevated, Windows 11 and a
  # serial console someone types at stay with the PC (tools/windows/README.md).
  windows-guest:
    # linux-boot makes the snapshot of the linux-snapshot stage; without it
    # (linux-boot failed) that stage alone is not run, saying why.
    needs: [windows, linux-boot]
    # Runs whenever the windows job uploaded the kit, also when a step after
    # the upload failed (the unit tests run after it): such a failure keeps
    # the windows job, and so the run, red, and does not take the guests'
    # results with it. Run 43480682094 (4999ff6) skipped this job for three
    # failing unit tests and so never showed whether its guests booted.
    if: ${{ !cancelled() && needs.windows.outputs.kit == 'success' }}
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: powershell
    env:
      WBT: ${{ github.workspace }}\wbt
      WJT: ${{ github.workspace }}\wjt
    steps:
      # The kit of this commit: without it no step below has anything to
      # run, so those that run after a failure (success() || failure())
      # run only once it is here.
      - name: The kit of this commit
        id: kit
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: wick-windows-x86_64-${{ github.sha }}
          path: .
      - name: The snapshot made on Linux
        id: snapshot
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: linux-snapshot
          path: ${{ runner.temp }}/linux-snapshot
      # The machine on record: the image, the processor, whether this token
      # is elevated and what it holds.
      - name: Host
        run: |
          Get-CimInstance Win32_OperatingSystem | Format-List Caption, Version, BuildNumber
          Get-CimInstance Win32_Processor | Format-List Name, NumberOfCores, NumberOfLogicalProcessors
          Get-CimInstance Win32_ComputerSystem | Format-List Model, TotalPhysicalMemory, HypervisorPresent
          whoami /user /priv
          Get-ChildItem -Recurse -File lib, tools, winprobe.exe | Select-Object Length, FullName | Format-Table -AutoSize
      # Every stage of `all`, as a PC's default run has them, but hugepages
      # (its own step below), and diff-nospace, which needs the elevation
      # this runner has. Not in `all`: foreign-snapshot (it wants a state of
      # another architecture, which no job makes), linux-snapshot and gdb
      # (steps of their own). A stage that fails does not stop the others;
      # the script's exit status fails the step.
      - name: boot-test.ps1
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File tools\windows\boot-test.ps1 -WorkDir $env:WBT `
            -Stage all,diff-nospace -Except hugepages
          exit $LASTEXITCODE
      # The snapshot the linux-boot job of this run made (KVM, this commit's
      # build), loaded and resumed on WHP. A record: the stage's line says
      # RESTORED or REFUSED with Firecracker's error, and it fails only on
      # what is neither.
      # Not run, said so, when linux-boot did not succeed and so made no
      # snapshot (run 43790310601: its setup could not fetch upstream): that
      # job's own failure is the cause, and it keeps the run red. A missing
      # snapshot from a linux-boot that succeeded fails here.
      - name: boot-test.ps1 linux-snapshot
        if: (success() || failure()) && steps.kit.outcome == 'success'
        run: |
          if ("${{ steps.snapshot.outcome }}" -ne 'success' -and "${{ needs.linux-boot.result }}" -ne 'success') {
            "::warning::boot-test.ps1 linux-snapshot not run: linux-boot ${{ needs.linux-boot.result }}, so it produced no snapshot"
            exit 0
          }
          Get-Content "$env:RUNNER_TEMP\linux-snapshot\linux-x86_64.txt" -ErrorAction SilentlyContinue
          powershell -NoProfile -ExecutionPolicy Bypass -File tools\windows\boot-test.ps1 -WorkDir $env:WBT -Stage linux-snapshot `
            -LinuxSnapshot "$env:RUNNER_TEMP\linux-snapshot"
          exit $LASTEXITCODE
      # Option E's x2APIC partition on an AMD runner, through the kit's
      # x2APIC record build (kvm-ioctls' whp-x2apic-record; the product's
      # partitions stay xAPICs, vm::X2APIC_PARTITIONS): the guest in x2APIC
      # mode with its local timers in TSC-deadline mode, each LVT timer
      # write the backend's held page write (option E-ii), then CPU 1
      # offline and online after boot and after a snapshot restore. Five
      # runs, each its own guests; a PC runs it ten times. Option E makes
      # x2APIC partitions on AMD hosts only: on another runner (the job's
      # are AMD or Intel) the stage ends not applicable, exit code 3, with
      # the host's vendor and the build's line, which this step accepts
      # only where its own look at the processor finds no AMD one, once,
      # as a notice; on an AMD runner 3 is a failure.
      - name: boot-test.ps1 x2apic
        if: (success() || failure()) && steps.kit.outcome == 'success'
        run: |
          $cpu = Get-CimInstance Win32_Processor | Select-Object -First 1
          Write-Host "the runner's processor: $($cpu.Manufacturer), $($cpu.Name.Trim())"
          $failed = 0
          foreach ($i in 1..5) {
            powershell -NoProfile -ExecutionPolicy Bypass -File tools\windows\boot-test.ps1 -WorkDir $env:WBT -Stage x2apic
            $code = $LASTEXITCODE
            if ($code -eq 3 -and $cpu.Manufacturer -ne 'AuthenticAMD') {
              Write-Host "::notice::boot-test.ps1 x2apic is not applicable on this $($cpu.Manufacturer) runner: option E makes x2APIC partitions on AMD hosts only (the stage's line above)"
              exit 0
            }
            if ($code -ne 0) { $failed++ }
          }
          if ($failed) { Write-Host "::error::boot-test.ps1 x2apic failed in $failed of 5 runs"; exit 1 }
      # The guest files are the boot test's (-Assets). pidns, bindlink,
      # sections and hugepages have steps of their own.
      - name: jailer-test.ps1
        if: (success() || failure()) && steps.kit.outcome == 'success'
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File tools\windows\jailer-test.ps1 -WorkDir $env:WJT -Assets $env:WBT `
            -Stage refuse,freeze,cpuset,parent,weight,low,links,nofile,daemonize,handles,handoff,netns,netguest,api,isolation,boot,limits,memory,cpu,uffd,vhost-user
          exit $LASTEXITCODE
      # memory.max and sections (docs/COMPATIBILITY.md, the memory.max row's
      # Windows cell; SECURITY.md, W2): the job refuses private memory, the
      # jailer's count ends a jail whose pagefile-backed sections pass the
      # limit with 137 at the next 1 ms poll, and temporary-file sections
      # (page cache) are allowed. Its own step, with its own work directory,
      # so that its result reads apart from the other stages'.
      - name: jailer-test.ps1 sections
        if: (success() || failure()) && steps.kit.outcome == 'success'
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File tools\windows\jailer-test.ps1 -WorkDir "$env:WJT-sections" -Assets $env:WBT -Stage sections
          $code = $LASTEXITCODE
          Get-Content "$env:WJT-sections\summary.txt" -ErrorAction SilentlyContinue
          exit $code
      # pidns types into its console and reads it, and a step has none: the
      # script runs in a console of its own, as in a PowerShell window, and
      # its output is the summary it writes.
      - name: jailer-test.ps1 pidns, in a console of its own
        if: (success() || failure()) && steps.kit.outcome == 'success'
        run: |
          $p = Start-Process powershell -PassThru -Wait -ArgumentList @('-NoProfile', '-ExecutionPolicy', 'Bypass', '-File',
            'tools\windows\jailer-test.ps1', '-WorkDir', "$env:WJT-pidns", '-Assets', $env:WBT, '-Stage', 'pidns')
          Get-Content "$env:WJT-pidns\summary.txt" -ErrorAction SilentlyContinue
          if ($p.ExitCode -ne 0) { Write-Host "::error::jailer-test.ps1 pidns: exit $($p.ExitCode)"; exit 1 }
      # Bind links need System32\bindlink.dll, which neither this image
      # (Windows Server 2025, build 26100: run 43428124115) nor the one PC
      # (Windows 11 build 26300) has. Without it the stage can only fail at
      # that check, which is what the docs say (tools/windows/
      # integration-test-differences.txt, test_jailer_bind_mount_propagation
      # impossible here): the step then passes only if the stage failed with
      # exactly that line and left no drive, and says so; anything else
      # fails it. With the DLL the stage's result is the step's.
      - name: jailer-test.ps1 bindlink
        if: (success() || failure()) && steps.kit.outcome == 'success'
        run: |
          Get-Item "$env:SystemRoot\System32\bindlink.dll", "$env:SystemRoot\System32\bindfltapi.dll" -ErrorAction SilentlyContinue |
            Format-Table Name, Length, @{ n = 'Version'; e = { $_.VersionInfo.FileVersion } }
          $dll = Test-Path "$env:SystemRoot\System32\bindlink.dll"
          powershell -NoProfile -ExecutionPolicy Bypass -File tools\windows\jailer-test.ps1 -WorkDir "$env:WJT-bindlink" -Assets $env:WBT -Stage bindlink
          $rc = $LASTEXITCODE
          if ($dll) { exit $rc }
          $lines = @(Get-Content "$env:WJT-bindlink\summary.txt" -ErrorAction SilentlyContinue)
          $refused = @($lines | Where-Object { $_ -match '^FAIL  bindlink: this Windows \(build \d+\) has no bind links: no .*\\bindlink\.dll ' })
          $drives = @($lines | Where-Object { $_ -eq 'PASS  drives: every jail drive was removed' })
          $failed = @($lines | Where-Object { $_.StartsWith('FAIL') })
          if ($refused.Count -eq 1 -and $drives.Count -eq 1 -and $failed.Count -eq 1) {
            Write-Host "::notice::bindlink: no bindlink.dll on this image; the stage failed at that check, as documented (test_jailer_bind_mount_propagation is impossible here)"
            exit 0
          }
          Write-Host "::error::bindlink without bindlink.dll: expected only the stage's no-DLL failure and no drive left; got: $($lines -join ' | ')"
          exit 1
      # Large pages need "Lock pages in memory" in the token, and a right
      # given to an account reaches only a logon made after it. So: the right
      # is given to this account (secedit), the account gets a password of
      # this job's making, and the two hugepages stages run in a scheduled
      # task as that account, which is a new logon. The task's own first
      # lines say whether its token holds the privilege; if this cannot be
      # set up, the step fails saying which part, and the stages stay the
      # PC's.
      - name: hugepages stages, in a logon that holds Lock pages in memory
        if: (success() || failure()) && steps.kit.outcome == 'success'
        run: |
          $ErrorActionPreference = 'Stop'
          $sid = [Security.Principal.WindowsIdentity]::GetCurrent().User.Value
          $user = "$env:COMPUTERNAME\$env:USERNAME"
          $dir = Join-Path $env:RUNNER_TEMP 'hugepages'
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          $cfg = Join-Path $dir 'rights.inf'
          secedit /export /cfg $cfg /areas USER_RIGHTS | Out-Null
          $lines = Get-Content $cfg
          if ($lines -match '^SeLockMemoryPrivilege') {
              $lines = $lines | ForEach-Object { if ($_ -match '^SeLockMemoryPrivilege' -and $_ -notmatch [regex]::Escape($sid)) { "$_,*$sid" } else { $_ } }
          } else {
              $lines = $lines | ForEach-Object { $_; if ($_ -eq '[Privilege Rights]') { "SeLockMemoryPrivilege = *$sid" } }
          }
          $lines | Set-Content -Encoding Unicode $cfg
          secedit /configure /db (Join-Path $dir 'rights.sdb') /cfg $cfg /areas USER_RIGHTS | Out-Null
          if ($LASTEXITCODE -ne 0) { Write-Host "::error::hugepages: secedit could not give $user Lock pages in memory (exit $LASTEXITCODE)"; exit 1 }
          $bytes = New-Object byte[] 18
          [Security.Cryptography.RandomNumberGenerator]::Create().GetBytes($bytes)
          $password = 'Wk1!' + [Convert]::ToBase64String($bytes)
          net user $env:USERNAME $password | Out-Null
          if ($LASTEXITCODE -ne 0) { Write-Host "::error::hugepages: the account's password could not be set (exit $LASTEXITCODE)"; exit 1 }
          $script = Join-Path $dir 'run.ps1'
          $root = (Get-Location).Path
          @"
          Set-Location '$root'
          whoami /priv > '$dir\priv.txt' 2>&1
          powershell -NoProfile -ExecutionPolicy Bypass -File tools\windows\boot-test.ps1 -WorkDir '$env:WBT' -Stage hugepages > '$dir\boot-test.txt' 2>&1
          "boot-test `$LASTEXITCODE" > '$dir\boot-test.exit'
          powershell -NoProfile -ExecutionPolicy Bypass -File tools\windows\jailer-test.ps1 -WorkDir '$env:WJT-hugepages' -Assets '$env:WBT' -Stage hugepages > '$dir\jailer-test.txt' 2>&1
          "jailer-test `$LASTEXITCODE" > '$dir\jailer-test.exit'
          'done' > '$dir\done'
          "@ | Set-Content -Encoding UTF8 $script
          schtasks /Create /F /TN wick-hugepages /SC ONCE /ST 00:00 /RL HIGHEST /RU $user /RP $password `
            /TR "powershell -NoProfile -ExecutionPolicy Bypass -File `"$script`"" | Out-Null
          if ($LASTEXITCODE -ne 0) { Write-Host "::error::hugepages: the task could not be made for $user (exit $LASTEXITCODE)"; exit 1 }
          schtasks /Run /TN wick-hugepages | Out-Null
          $deadline = [DateTime]::Now.AddMinutes(15)
          while (-not (Test-Path "$dir\done") -and [DateTime]::Now -lt $deadline) { Start-Sleep -Seconds 2 }
          schtasks /Query /TN wick-hugepages /V /FO LIST | Select-String 'Status|Last Result|Run As User'
          schtasks /Delete /F /TN wick-hugepages | Out-Null
          foreach ($f in 'priv.txt', 'boot-test.txt', 'jailer-test.txt', 'boot-test.exit', 'jailer-test.exit') {
              Write-Host "== $f"; Get-Content "$dir\$f" -ErrorAction SilentlyContinue
          }
          if (-not (Test-Path "$dir\done")) { Write-Host '::error::hugepages: the task did not finish in 15 minutes (see its status above)'; exit 1 }
          if (-not (Select-String -Quiet 'SeLockMemoryPrivilege' "$dir\priv.txt")) {
              Write-Host "::error::hugepages: the task's token does not hold SeLockMemoryPrivilege: the stages ran without what they need"
          }
          $bad = @(Get-Content "$dir\boot-test.exit", "$dir\jailer-test.exit" | Where-Object { $_ -notmatch ' 0$' })
          if ($bad) { Write-Host "::error::hugepages stages failed: $($bad -join ', ')"; exit 1 }
      # A gdb that reads x86-64 Linux kernels: MSYS2's gdb-multiarch, the
      # package pinned by its file and checksum, its dependencies from the
      # image's MSYS2. The Firecracker is the kit's gdb build (the debug one).
      - name: boot-test.ps1 gdb
        if: (success() || failure()) && steps.kit.outcome == 'success'
        run: |
          $ErrorActionPreference = 'Stop'
          $name = 'mingw-w64-ucrt-x86_64-gdb-multiarch-18.1-3-any.pkg.tar.zst'
          $pkg = Join-Path $env:RUNNER_TEMP $name
          Invoke-WebRequest -UseBasicParsing "https://repo.msys2.org/mingw/ucrt64/$name" -OutFile $pkg
          $hash = (Get-FileHash -Algorithm SHA256 $pkg).Hash.ToLower()
          if ($hash -ne '7012a9a85024bf721c8195b0724e7f88aac922d6ae38ce10793bab904f69fb22') { Write-Host "::error::gdb: $name has checksum $hash"; exit 1 }
          if (-not (Test-Path C:\msys64\usr\bin\pacman.exe)) { Write-Host '::error::gdb: this image has no MSYS2 at C:\msys64 to install the package with'; exit 1 }
          $env:PATH = "C:\msys64\usr\bin;$env:PATH"
          pacman -U --noconfirm --needed ($pkg -replace '\\', '/')
          if ($LASTEXITCODE -ne 0) { Write-Host "::error::gdb: pacman could not install $name (exit $LASTEXITCODE)"; exit 1 }
          & C:\msys64\ucrt64\bin\gdb-multiarch.exe --version | Select-Object -First 1
          powershell -NoProfile -ExecutionPolicy Bypass -File tools\windows\boot-test.ps1 -WorkDir $env:WBT -Stage gdb `
            -Gdb C:\msys64\ucrt64\bin\gdb-multiarch.exe
          exit $LASTEXITCODE
      - name: What ran, and what stays with the PC
        if: always()
        run: |
          $out = @('## Windows stages on the runner', '')
          foreach ($f in Get-ChildItem -Path "$env:WJT*\summary.txt" -ErrorAction SilentlyContinue) { $out += '```'; $out += Get-Content $f; $out += '```' }
          foreach ($f in Get-ChildItem -Path "$env:RUNNER_TEMP\hugepages\*.exit" -ErrorAction SilentlyContinue) { $out += "- hugepages: $(Get-Content $f)" }
          $out += ''
          $out += 'boot-test.ps1 prints its stages in its step and keeps them in the results archive of the artifact.'
          $out += ''
          $out += 'Known gaps, steps that pass only on their documented failure (a green job is not "everything passes"):'
          $out += '- jailer-test.ps1 bindlink: no bindlink.dll on this image, so no bind links (test_jailer_bind_mount_propagation impossible here); with the DLL the stage''s result counts.'
          $out += ''
          $out += 'Not run here, the PC''s: the jailer unelevated (this token is elevated), Windows 11 (this is Windows Server),'
          $out += 'a serial console someone types at, and boot-test.ps1 foreign-snapshot (it needs a state file of another'
          $out += 'architecture, the macOS boot test''s; no job of this workflow makes one).'
          $out | Add-Content -Encoding UTF8 $env:GITHUB_STEP_SUMMARY
      # The jails' directories hold what the jailed processes made, under
      # their own ACLs: the upload's glob walked them and stopped at the
      # first entry it could not stat (run 43428124115: EACCES on a jail's
      # API socket under wjt-pidns), uploading nothing. The logs are copied
      # out first, each entry that cannot be read named, and the upload
      # takes the copy.
      - name: Collect the stages' logs
        if: always()
        run: |
          $dest = Join-Path $env:RUNNER_TEMP 'guest-logs'
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          $root = (Get-Location).Path
          $unread = @()
          $found = @(Get-Item -Path "$env:WBT\results-*.zip" -ErrorAction SilentlyContinue)
          # A boot test that was cancelled or timed out leaves its results
          # directory unzipped, each stage's console log in it (run
          # 43435331370 lost them all this way): those are taken as they are.
          foreach ($d in Get-ChildItem -Directory -Path "$env:WBT\results-*" -ErrorAction SilentlyContinue) {
            if (-not (Test-Path -LiteralPath "$($d.FullName).zip")) {
              $found += @(Get-ChildItem -Recurse -File -Path $d.FullName -Include *.txt, *.log -ErrorAction SilentlyContinue -ErrorVariable +walk)
            }
          }
          foreach ($d in Get-ChildItem -Directory -Path "$env:WJT*" -ErrorAction SilentlyContinue) {
            $found += @(Get-ChildItem -Recurse -File -Path $d.FullName -Include *.txt, *.log -ErrorAction SilentlyContinue -ErrorVariable +walk)
          }
          foreach ($e in $walk) { $unread += "$($e.TargetObject): $($e.Exception.Message)" }
          $found += @(Get-Item -Path "$env:RUNNER_TEMP\hugepages\*.txt", "$env:RUNNER_TEMP\hugepages\*.exit" -ErrorAction SilentlyContinue)
          foreach ($f in $found) {
            $rel = if ($f.FullName.StartsWith($root)) { $f.FullName.Substring($root.Length + 1) } else { Join-Path 'temp' $f.FullName.Substring($env:RUNNER_TEMP.Length + 1) }
            $to = Join-Path $dest $rel
            New-Item -ItemType Directory -Force -Path (Split-Path $to) | Out-Null
            try { Copy-Item -LiteralPath $f.FullName -Destination $to -ErrorAction Stop } catch { $unread += "$($f.FullName): $($_.Exception.Message)" }
          }
          Write-Host "$($found.Count) files found, $($unread.Count) entries not read"
          foreach ($u in $unread) { Write-Host "  not read: $u" }
      - name: Upload the stages' logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-guest-logs
          path: ${{ runner.temp }}/guest-logs
          if-no-files-found: warn
          retention-days: 14
