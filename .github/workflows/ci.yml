#
# Build and test wick on Linux, macOS and Windows (CONTRIBUTING.md, "Tests").
name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Weekly, with all of upstream's functional and security integration tests.
  schedule:
    - cron: "23 3 * * 1"
  workflow_dispatch:
    inputs:
      integration:
        description: "Linux integration tests: the subset every push runs, or upstream's functional and security suites"
        type: choice
        options: [subset, full]
        default: subset

permissions:
  contents: read

concurrency:
  # A push does not cancel the weekly or a full run on the same branch.
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}-${{ inputs.integration }}
  cancel-in-progress: true

jobs:
  patches:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false
      - name: Apply the patch series
        run: tools/setup.sh
      - name: Check the patch series
        run: tools/patches.sh check
      - name: Check generated Windows sources
        run: |
          (cd lib/firecracker && cargo fetch --locked -q)
          tools/gen-kvm-bindings-windows.sh --check
          tools/gen-windows-sources.sh --check
      - name: Actions are pinned by commit
        run: |
          unpinned="$(grep -nE '^\s*(-\s+)?uses:' .github/workflows/*.yml | grep -vE 'uses:\s*[^@ ]+@[0-9a-f]{40}( |$)' || true)"
          [[ -z "$unpinned" ]] || { echo "::error::actions not pinned by full commit SHA:"; echo "$unpinned"; exit 1; }
      # Every "in place", "verified" or "measured" in the docs' tables names
      # the test that checks it, Windows cells included.
      - name: Doc claims name their tests
        run: python3 tools/check-claims.py --strict-windows
      - name: Compatibility matrix progress and counts are current
        run: python3 -I tools/compat-counts.py --check docs/COMPATIBILITY.md
      - name: Cleanup script
        run: |
          bash -n tools/clean.sh
          tools/clean.sh --dry-run

  # Dependency policy (CONTRIBUTING.md, "Dependencies"): RustSec advisories,
  # licenses, banned and duplicate crates and sources for lib/firecracker's
  # Cargo.lock and tools/vhost-user-blk's, with cargo-deny at upstream's
  # version. The weekly run catches advisories published against an unchanged
  # lockfile.
  dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false
      - run: tools/setup.sh
      - name: Install cargo-deny
        run: |
          source tools/common.sh
          cargo install --locked cargo-deny --version "$(cargo_deny_version)"
      - name: Dependency checks
        run: tools/check-dependencies.sh

  linux:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false
      - run: tools/setup.sh
      - name: Report KVM availability
        run: ls -l /dev/kvm || echo "no /dev/kvm on ${{ matrix.runner }}"
      - name: Install build dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libseccomp-dev
      - name: Build firecracker
        working-directory: lib/firecracker
        run: cargo build --locked -p firecracker
      # What upstream's jailer does with the freezer and devices cgroups (the
      # reference for the macOS and Windows jailers), measured as root.
      - name: Build the jailer
        working-directory: lib/firecracker
        run: cargo build --locked -p jailer
      - name: Upstream jailer's freezer and devices cgroups
        run: sudo python3 -I tools/linux/jailer-cgroup-check.py --jailer lib/firecracker/build/cargo_target/debug/jailer

  # Upstream's unit tests as upstream's CI runs them (its development
  # container, as root, musl, one test thread: tools/linux/unit-tests.sh),
  # first for plain upstream at patches/base and then for wick, on the same
  # machine. wick must match upstream test by test; tests that fail on plain
  # upstream there are listed with the reason in
  # tools/linux/unit-test-exclusions.txt. The x86_64 runner has KVM, the arm
  # one does not.
  linux-unit-tests:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false
      - run: tools/setup.sh
      - name: Host
        run: |
          uname -a
          df -h /
          grep -m1 '^model name' /proc/cpuinfo || true
          nproc
          free -g
          ls -l /dev/kvm || echo "no /dev/kvm on ${{ matrix.runner }}"
      - name: Unit tests, plain upstream
        run: tools/linux/unit-tests.sh upstream "$RUNNER_TEMP/unit/upstream"
      - name: Unit tests, wick
        run: tools/linux/unit-tests.sh wick "$RUNNER_TEMP/unit/wick"
      - name: Compare wick with upstream
        run: |
          tools/linux/compare-unit-tests.py "$RUNNER_TEMP/unit/upstream" "$RUNNER_TEMP/unit/wick" \
            --summary "$GITHUB_STEP_SUMMARY"
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-unit-tests-${{ runner.arch }}
          path: |
            ${{ runner.temp }}/unit/*/*.log
            ${{ runner.temp }}/unit/*/*.json
            ${{ runner.temp }}/unit/*/*.status
            ${{ runner.temp }}/unit/*/arch
            ${{ runner.temp }}/unit/*/cpu
          if-no-files-found: warn
          retention-days: 14

  # A guest on KVM with the binary upstream would ship: tools/release.sh's
  # musl release build (seccomp filters installed), booted by
  # tools/linux/boot-test.sh with upstream's CI kernel and rootfs.
  linux-boot:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false
      - run: tools/setup.sh
      - name: Give the runner user /dev/kvm
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm
      - name: Release build (upstream's tools/release.sh, musl)
        run: tools/linux/devctr.sh --chown lib/firecracker/build -- ./tools/release.sh --libc musl --profile release
      # Upstream's release.sh builds without --locked.
      - name: The build kept Cargo.lock
        run: git -C lib/firecracker diff --exit-code -- Cargo.lock
      - name: Boot test
        run: tools/linux/boot-test.sh --workdir "$RUNNER_TEMP/boot-test"
      # A host without /dev/nitro_enclaves: the start of an enclave is refused,
      # and the same script checks the same replies on macOS.
      - name: Nitro Enclave refused without the device
        run: python3 -I tools/macos/enclave-refusal-test.py "lib/firecracker/build/cargo_target/$(uname -m)-unknown-linux-musl/release/firecracker"
      # One snapshot's state file made here, on Linux x86_64: what the macos
      # job's foreign snapshot step (tools/macos/foreign-snapshot-test.py) is
      # given, a state made on another host OS; boot-test.ps1's
      # foreign-snapshot stage takes an aarch64 one as -ForeignState (an x86_64
      # state decodes on Windows; that case is the linux-snapshot stage, in
      # the windows-guest job, with the whole snapshot kept below).
      - name: A snapshot's state file for the other hosts' tests
        run: python3 -I tools/linux/make-vmstate.py "lib/firecracker/build/cargo_target/$(uname -m)-unknown-linux-musl/release/firecracker" "$RUNNER_TEMP/boot-test" "$RUNNER_TEMP/vmstate" "$RUNNER_TEMP/vmsnapshot"
      # The whole snapshot, memory file too (128 MiB before the artifact's
      # compression): what a Windows host of the same architecture restores
      # (boot-test.ps1 linux-snapshot).
      - name: Upload the whole snapshot
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-snapshot
          path: ${{ runner.temp }}/vmsnapshot/
          if-no-files-found: error
          retention-days: 3
      - name: Upload the state file
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-vmstate
          path: ${{ runner.temp }}/vmstate/
          if-no-files-found: error
          retention-days: 90
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-boot-test
          path: ${{ runner.temp }}/boot-test/results-*
          if-no-files-found: warn
          retention-days: 14

  # Upstream's integration tests (pytest) as upstream's devtool runs them
  # (tools/linux/integration-tests.sh): plain upstream, then wick, on the same
  # machine, compared test by test. Every push runs a subset (API, boot and
  # serial, block, vsock, net, balloon, entropy, pause/resume, snapshots,
  # userfaultfd, jailer, seccomp); the weekly run and a dispatch with
  # integration=full run upstream's functional and security suites, as its
  # PR pipeline does. Guest kernel 6.1 only (CONTRIBUTING.md, "Tests").
  linux-integration-tests:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ (github.event_name == 'schedule' || inputs.integration == 'full') && 150 || 75 }}
    env:
      SUITE: ${{ (github.event_name == 'schedule' || inputs.integration == 'full') && 'full' || 'subset' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false
      - run: tools/setup.sh
      - name: Host
        run: |
          uname -a
          grep -m1 '^model name' /proc/cpuinfo
          nproc
          free -g
          df -h /
      - name: Select the tests
        run: |
          if [[ "$SUITE" == full ]]; then
            tests="integration_tests/functional integration_tests/security"
          else
            tests="$(printf 'integration_tests/%s ' \
              functional/test_api.py functional/test_drive_virtio.py functional/test_vsock.py \
              functional/test_snapshot_basic.py functional/test_serial_io.py functional/test_shut_down.py \
              functional/test_cmd_line_start.py functional/test_pause_resume.py functional/test_net.py \
              functional/test_balloon.py functional/test_rng.py functional/test_uffd.py \
              security/test_jail.py security/test_seccomp.py)"
          fi
          echo "TESTS=-n 4 --dist worksteal $tests" >>"$GITHUB_ENV"
          echo "$SUITE: $tests"
      # $TESTS is split into pytest's arguments on purpose.
      - name: Integration tests, plain upstream
        run: |
          # shellcheck disable=SC2086
          tools/linux/integration-tests.sh upstream "$RUNNER_TEMP/it/upstream" $TESTS
      - name: Integration tests, wick
        if: always()
        run: |
          # shellcheck disable=SC2086
          tools/linux/integration-tests.sh wick "$RUNNER_TEMP/it/wick" $TESTS
      - name: Compare wick with upstream
        if: always()
        run: |
          tools/linux/compare-integration-tests.py "$RUNNER_TEMP/it/upstream" "$RUNNER_TEMP/it/wick" \
            --summary "$GITHUB_STEP_SUMMARY"
      # Informational, never fails the job: the VMM's own memory at its peak,
      # by kind of mapping, for the tests whose memory macOS compares with
      # Linux's (tools/linux/integration/wick_memdiag.py, loaded in this step
      # only: the steps above keep upstream's monitor as it is). With them,
      # the tests Windows compares: test_cpuid boots 1, 2 and 16 vCPUs on
      # any host (its own parameters), which gives what a vCPU adds here,
      # thread stacks and kvm vcpu pages apart; Windows fails it on the
      # 5 MiB budget at 16. test_all_vcpus_online, which fails there too,
      # takes as many vCPUs as the host has processors, up to 32: on this
      # runner that is a few (the table's vcpus column says how many). The
      # other five tests Windows fails on that budget are run for their
      # rows as well. Run 43388798760's table had thread stacks and anon
      # other at 0 and every anonymous mapping under file other: psutil
      # names an anonymous mapping "[anon]", which the classifier now
      # reads (its selftest runs first).
      - name: VMM memory by kind of mapping (informational)
        if: success() || failure()
        continue-on-error: true
        run: |
          python3 -I tools/linux/integration/wick_memdiag.py selftest
          WICK_IT_MEMDIAG=1 tools/linux/integration-tests.sh wick "$RUNNER_TEMP/it/memdiag" -n 1 \
            integration_tests/functional/test_vsock.py::test_vsock_epipe \
            integration_tests/functional/test_vsock.py::test_vsock_transport_reset_h2g \
            integration_tests/functional/test_balloon.py::test_deflate_on_oom \
            integration_tests/functional/test_cpu_features_x86_64.py::test_cpuid \
            integration_tests/functional/test_cpu_all.py::test_all_vcpus_online \
            integration_tests/functional/test_cpu_all.py::test_all_vcpus_have_same_features \
            integration_tests/functional/test_topology.py::test_cache_topology \
            integration_tests/functional/test_hotplug.py::test_hotplug_max_devices \
            integration_tests/functional/test_metrics.py::test_net_metrics \
            integration_tests/functional/test_api.py::test_get_full_config_after_restoring_snapshot
          python3 -I tools/linux/integration/wick_memdiag.py summary \
            "$RUNNER_TEMP/it/memdiag/memory-peaks.jsonl" | tee -a "$GITHUB_STEP_SUMMARY"
      # Upstream's release.sh, which the tests build with, has no --locked.
      - name: The build kept Cargo.lock
        if: always()
        run: git -C lib/firecracker diff --exit-code -- Cargo.lock
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-integration-tests-${{ env.SUITE }}
          path: |
            ${{ runner.temp }}/it/*/memory-peaks.jsonl
            ${{ runner.temp }}/it/*/pytest.log
            ${{ runner.temp }}/it/*/test-report.json
            ${{ runner.temp }}/it/*/status
            ${{ runner.temp }}/it/*/arch
          if-no-files-found: warn
          retention-days: 14

  # macOS (Apple silicon): build, lint and the compatibility crates' tests.
  # Booting a guest needs Hypervisor.framework, which hosted runners do not
  # expose, so L3 runs on a Mac (tools/macos/run.sh).
  macos:
    # After linux-boot, for the state file it makes (the foreign snapshot
    # step); it runs when linux-boot has failed too, and that step alone
    # fails then.
    needs: linux-boot
    if: ${{ !cancelled() }}
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      MACOSX_DEPLOYMENT_TARGET: "15.0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false
      - run: tools/setup.sh
      - name: Install clippy
        working-directory: lib/firecracker
        run: rustup component add clippy
      - name: Build firecracker
        working-directory: lib/firecracker
        run: cargo build --locked -p firecracker --bin firecracker
      - name: Clippy
        working-directory: lib/firecracker
        run: cargo clippy --locked -p vmm -p firecracker -p wick-ext -p jailer --lib --bins --tests -- -D warnings
      # As upstream on a Linux host without /dev/nitro_enclaves (linux-boot
      # runs the same script there).
      - name: Nitro Enclave refused without the device
        run: python3 -I tools/macos/enclave-refusal-test.py lib/firecracker/build/cargo_target/debug/firecracker
      # The jailer's tests run as root, as upstream's do (they set resource
      # limits and change owners); the runners have passwordless sudo.
      - name: Jailer unit tests
        working-directory: lib/firecracker
        run: |
          bin=$(cargo test --locked -p jailer --no-run --message-format=json |
            jq -r 'select(.profile.test == true and .target.name == "jailer") | .executable')
          sudo env RUST_TEST_THREADS=1 "$bin" --skip platform::macos::freezer::tests::test_self_check_under_load
          # Its count of the reads the old self-check would have failed on
          # (libtest shows a passing test's output only with --nocapture).
          sudo env RUST_TEST_THREADS=1 "$bin" platform::macos::freezer::tests::test_self_check_under_load --exact --nocapture
      - name: Jailer scenario tests (without a VM)
        id: jailer_scenarios
        run: tools/macos/jailer-test.sh --no-vm
      # What each jailer and Firecracker of a failed stage printed (the run
      # directory: <name>.log, the results): run 43341846250's vmnet failure
      # (a refused connection to the API socket) left nothing to tell a
      # Firecracker that had ended from one not yet listening.
      - name: Upload the jailer scenarios' logs
        if: failure() && steps.jailer_scenarios.conclusion == 'failure'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-jailer-test
          path: build/jailer-test/
          if-no-files-found: warn
          retention-days: 14
      # A state file made on Linux x86_64 by this run's linux-boot job is
      # refused here with upstream's error, before a VM is made (so it needs
      # no Hypervisor.framework). When linux-boot has failed there is no file:
      # the download fails (the action's error for a name that is not there),
      # the test after it is skipped, and the job fails; the steps before and
      # after are not held back.
      - name: Download the state file made on Linux
        # Runs after an earlier step's failure too: each step answers its own question.
        if: success() || failure()
        id: vmstate
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: linux-vmstate
          path: ${{ runner.temp }}/linux-vmstate
      - name: A snapshot made on Linux x86_64 is refused
        if: (success() || failure()) && steps.vmstate.outcome == 'success'
        working-directory: lib/firecracker
        run: |
          cargo build --locked -p snapshot-editor
          cat "$RUNNER_TEMP/linux-vmstate/linux-x86_64.txt"
          python3 -I ../../tools/macos/foreign-snapshot-test.py build/cargo_target/debug/firecracker \
            build/cargo_target/debug/snapshot-editor "$RUNNER_TEMP/linux-vmstate/linux-x86_64.vmstate"
      # Upstream's integration tests need a VM (tools/macos/integration-tests.sh
      # runs them on a Mac); their harness's network namespace and comparison
      # run here.
      - name: Integration test harness (without a VM)
        # Runs after an earlier step's failure too: each step answers its own question.
        if: success() || failure()
        run: |
          brew install libslirp pkg-config
          cc -O2 -Wall -Wextra -Werror -o "$RUNNER_TEMP/netns-slirp" tools/macos/integration/netns-slirp.c \
            $(pkg-config --cflags --libs slirp)
          cc -O2 -Wall -Wextra -Werror -dynamiclib -o "$RUNNER_TEMP/netns-preload.dylib" tools/macos/integration/netns-preload.c
          python3 -I tools/macos/integration/netns-selftest.py "$RUNNER_TEMP/netns-slirp" "$RUNNER_TEMP/netns-preload.dylib"
          python3 -m py_compile tools/macos/integration/wick_macos.py tools/macos/integration/wick_macos_net.py \
            tools/macos/integration/jailer tools/macos/integration/bin/ip tools/macos/integration/bin/fallocate \
            tools/macos/compare-integration-tests.py
          # The harness's memory readings (get_resident_memory, memory_maps)
          # on a helper process, in upstream's test environment (venv.sh).
          brew install uv
          tools/macos/integration/venv.sh
          # wick_macos imports upstream's framework, whose framework/defs.py
          # reads the guest artifacts' directory from
          # lib/firecracker/build/current_artifacts (integration-tests.sh
          # writes it); the runner has no guest artifacts: an empty directory.
          mkdir -p "$RUNNER_TEMP/no-guest-artifacts" lib/firecracker/build
          echo "$RUNNER_TEMP/no-guest-artifacts" >lib/firecracker/build/current_artifacts
          build/integration/venv/bin/python tools/macos/integration/memory-selftest.py
      # How late this runner fires a timer, by kind of wait (macOS coalesces
      # timers; the compat timerfd waits on a NOTE_CRITICAL one, a88980c).
      # It prints and never fails: it is what a timing test's failure below is
      # read against.
      - name: Timer coalescing on this runner (informational)
        # Runs after an earlier step's failure too: each step answers its own question.
        if: success() || failure()
        run: python3 -I tools/macos/timer-coalescing.py
      # Every test of every crate but the jailer runs; the ones that cannot
      # pass on a runner (they create a VM, and GitHub's macOS runners have no
      # Hypervisor.framework) are listed by name and reason, and the check
      # fails on an unlisted failure, a listed test that passes, or a listed
      # name that is no test. tools/macos/test.sh runs the listed ones on a
      # Mac, and tools/macos/boot-test.sh the scenarios.
      # Last in the job, so a unit test's failure does not keep the jailer and
      # harness steps above from running.
      - name: Unit tests of every crate but the jailer (tools/macos/unit-test-differences.txt)
        # Runs after an earlier step's failure too: each step answers its own question.
        if: success() || failure()
        run: python3 -I tools/macos/check-unit-tests.py --out "$RUNNER_TEMP/unit" --summary "$GITHUB_STEP_SUMMARY"
      # Every test's result by name (tests.tsv) and each crate's output.
      - name: Upload the unit tests' output
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-unit-tests
          path: |
            ${{ runner.temp }}/unit/*.log
            ${{ runner.temp }}/unit/tests.tsv
          if-no-files-found: warn
          retention-days: 14

  # Seatbelt differs between macOS majors (which system calls' numbers it
  # skips when a rule allows their operation: UNFILTERED_SYSCALLS and
  # MEASURED_MAJORS in overlay/vmm/ext/sandbox.rs), so the sandbox's tests
  # measure every major wick supports (README: macOS 15 and later) on GitHub's
  # runner image of each; a major the table lacks fails naming it and what it
  # measured.
  macos-seatbelt:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-26]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      MACOSX_DEPLOYMENT_TARGET: "15.0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false
      - run: tools/setup.sh
      - name: Host sandbox tests
        working-directory: lib/firecracker
        run: |
          sw_vers
          cargo test --locked -p vmm --lib "ext::sandbox" -- \
            --skip ext::sandbox::macos::tests::test_sigsys_handler_work_ends_the_process_within_its_deadline
          # Alone and with --nocapture, so its stages and their distribution
          # (SIGSYS_DEADLINE's measurement) are in the log, passing or not.
          cargo test --locked -p vmm --lib \
            ext::sandbox::macos::tests::test_sigsys_handler_work_ends_the_process_within_its_deadline \
            -- --exact --nocapture
      # The API process's profile test once failed on macos-15 with its child
      # dead before its first marker (c7d32e2); run alone, repeatedly, it
      # shows whether that is intermittent and how often.
      - name: API process profile test, 20 runs
        if: success() || failure()
        working-directory: lib/firecracker
        run: |
          failed=0
          for i in $(seq 20); do
            cargo test --locked -q -p vmm --lib \
              ext::sandbox::macos::tests::test_api_profile_raises_sigsys_outside_its_list -- --exact \
              > "$RUNNER_TEMP/api-profile-$i.log" 2>&1 || { failed=$((failed + 1)); cat "$RUNNER_TEMP/api-profile-$i.log"; }
          done
          echo "$failed of 20 runs failed"
          [[ $failed -eq 0 ]]
      # The FIFO relay's stop before the API process's fork reads the
      # kernel's list of thread ids with a proc_info flavor of xnu's private
      # header (PROC_PIDLISTTHREADIDS, overlay/vmm/ext/fifo.rs), and the fork
      # counts threads with another: both run on each major here, where the
      # macos job has one. The test binary is the one the steps above built;
      # one test thread, as check-unit-tests.py runs them; none makes a VM.
      - name: FIFO relay and API process tests
        if: success() || failure()
        working-directory: lib/firecracker
        run: |
          cargo test --locked -p vmm --lib "ext::fifo" -- --test-threads=1
          cargo test --locked -p vmm --lib "ext::api_process" -- --test-threads=1
      # What the sandbox denied the test processes (vmm-<hash>), for a
      # failure above: the kernel reports a denied call by its number
      # ("deny(1) syscall-unix 117"), SIGSYS or not. All of the lines: the
      # last 300 began after the failing test's process (run 1866e32, whose
      # tests of every number leave one line a process). A test of a
      # process that should have had no denied call prints the call itself
      # (sandbox.rs `diagnose_sigsys`).
      - name: Sandbox reports
        if: failure()
        run: |
          /usr/bin/log show --last 20m --style compact --predicate 'sender == "Sandbox"' |
            grep -E 'Sandbox: vmm-[0-9a-f]+\(' | grep -v ' allow ' || true

  # A minute of each fuzz target (fuzz/, CONTRIBUTING.md "Fuzzing"): they
  # build, their seeds pass, and a minute of new inputs finds nothing. Long
  # runs are local (tools/fuzz.sh -t SECONDS). uffd_protocol is macOS only;
  # on Windows the script runs from Git Bash, finds Visual Studio's
  # AddressSanitizer runtime, and leaves hvf_exit out (its host_targets).
  fuzz:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned nightly and cargo-fuzz
        run: |
          rustup toolchain install "$(tools/fuzz.sh --toolchain)" --profile minimal
          cargo install cargo-fuzz --locked --version 0.13.2
      - name: Fuzz each target for 60 seconds
        run: tools/fuzz.sh -t 60
      - name: Upload the inputs that failed
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-artifacts-${{ runner.os }}
          path: fuzz/artifacts/
          if-no-files-found: ignore
          retention-days: 14

  # Windows: the POSIX layer and the crates built over it, tested natively,
  # and the firecracker binary on the WHP backend.
  windows:
    runs-on: windows-latest
    # The unit-test step builds every package's tests (vmm's among them).
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false
      # The machine on record before anything can fail: windows-latest is not
      # one machine (run 43292883636's was an AMD EPYC 9V45; the runs before
      # it printed none), and what the unit tests and the WHP step measure
      # depends on its processor and on WHP being there.
      - name: Host
        shell: pwsh
        run: |
          Get-CimInstance Win32_Processor | Format-List Name,Manufacturer,NumberOfCores,NumberOfLogicalProcessors
          Get-CimInstance Win32_OperatingSystem | Format-List Caption,Version,BuildNumber
          Get-CimInstance Win32_ComputerSystem | Format-List HypervisorPresent
          try {
            Get-WindowsOptionalFeature -Online -FeatureName HypervisorPlatform -ErrorAction Stop | Format-List FeatureName,State
          } catch {
            "HypervisorPlatform: not read ($($_.Exception.Message))"
          }
          if (Test-Path "$env:SystemRoot\System32\WinHvPlatform.dll") { "WinHvPlatform.dll: present" } else { "WinHvPlatform.dll: absent" }
      - run: tools/setup.sh
      # Upstream tests put sockets and files under /tmp, which Windows
      # resolves to \tmp on the current drive.
      - name: Create \tmp on the working drive
        shell: pwsh
        run: New-Item -ItemType Directory -Force -Path "$((Get-Location).Drive.Name):\tmp" | Out-Null
      - name: Compatibility crate tests
        working-directory: lib/firecracker
        run: |
          for c in os std libc vmm-sys-util memfd event-manager micro-http userfaultfd; do
            cargo test --locked --manifest-path "../../crates/compat/$c/Cargo.toml"
          done
          # These two make several partitions with guest memory in one
          # process; they run in the WHP step, each in a process of its own
          # (on the runner every map after one refused beside another
          # partition's memory failed, run 43277608081).
          cargo test --locked --manifest-path ../../crates/compat/kvm-ioctls/Cargo.toml -- \
            --skip whp::vm::tests::test_vms_one_after_another_map_their_memory \
            --skip whp::vm::tests::test_one_partition_of_a_process_maps_memory
          # The gdb stub's guest debugging and connection, which only
          # Firecracker's gdb feature builds (whp/debug.rs checks that a build
          # without it makes the partition as before).
          cargo test --locked --manifest-path ../../crates/compat/kvm-ioctls/Cargo.toml --features gdb -- \
            whp::debug
          cargo test --locked --manifest-path ../../crates/compat/os/Cargo.toml --features gdbstub -- gdb
          cargo test --locked --manifest-path ../../crates/compat/vm-memory/Cargo.toml \
            --features backend-mmap,backend-bitmap,backend-atomic
          cargo test --locked --manifest-path ../../crates/compat/vhost/Cargo.toml \
            --features vhost-user-frontend,vhost-user-backend
      # The boot test's own helpers (serial-console protocol, vsock, network
      # switch) against stand-ins, in Windows PowerShell 5.1 as users run it.
      # Its boot stages run on the WHP PC, with its guest image.
      - name: Boot test harness self-test
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tools\windows\boot-test.ps1 -SelfTest
      # Upstream's integration tests need WHP (tools/windows/integration-tests.ps1
      # runs them on Windows hardware); their harness's AF_UNIX sockets,
      # network host side and host tools run here.
      - name: Integration test harness (without a VM)
        run: |
          # upstream's pin (tools/devctr/poetry.lock)
          python -m pip install --quiet psutil==6.1.1
          python -I tools/windows/integration/selftest.py
          python -m py_compile tools/windows/integration/*.py tools/windows/integration/netns_site/*.py
          python -m py_compile tools/windows/vmm-memory-record.py
          python -I tools/windows/vmm-memory-record.py --selftest
          python -I tools/windows/check-unit-tests.py --selftest
      # aws-lc-sys assembles its x86_64 code with NASM in release builds
      # (built from source rather than with its prebuilt objects).
      - name: Install NASM
        shell: pwsh
        run: |
          choco install nasm -y --no-progress
          "$env:ProgramFiles\NASM" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
      - name: Build firecracker (WHP backend)
        working-directory: lib/firecracker
        run: cargo build --locked -p firecracker --release
      - name: Smoke-test the binary
        working-directory: lib/firecracker
        run: build/cargo_target/release/firecracker.exe --version
      # The Linux and macOS jobs' check, through the harness's AF_UNIX
      # sockets: Windows has no /dev/nitro_enclaves either, and the start is
      # refused with Windows' error for the missing path (os error 3).
      - name: Nitro Enclave refused without the device
        run: python -I tools/windows/enclave-refusal-test.py lib/firecracker/build/cargo_target/release/firecracker.exe
      # The boot test's diff stage merges snapshots with it.
      - name: Build snapshot-editor
        working-directory: lib/firecracker
        run: cargo build --locked -p snapshot-editor --release
      # Upstream's other tools, which its integration tests run
      # (tools/windows/integration-tests.ps1).
      - name: Build rebase-snap, cpu-template-helper, seccompiler
        working-directory: lib/firecracker
        run: cargo build --locked -p rebase-snap -p cpu-template-helper -p seccompiler --release
      # The two rebase tools' tests. The five skipped write their diff file
      # without marking it sparse (holes by set_len or seeks, which NTFS
      # allocates as zeros); both tools refuse such a file on Windows rather
      # than copy its zeros over the base (patches/0036), so these fail
      # with that refusal.
      - name: rebase-snap and snapshot-editor tests
        working-directory: lib/firecracker
        run: |
          cargo test --locked -p rebase-snap -p snapshot-editor -- --exact \
            --skip tests::test_rebase \
            --skip tests::test_rebase_corner_cases \
            --skip edit_memory::tests::test_rebase \
            --skip edit_memory::tests::test_rebase_empty_diff \
            --skip edit_memory::tests::test_rebase_full_diff
      # Upstream's jailer with the Windows backend (overlay/jailer/platform):
      # its tests (tokens, job limits) and the binary.
      - name: Jailer tests and build
        working-directory: lib/firecracker
        run: |
          cargo test --locked -p jailer
          cargo build --locked -p jailer --release
      # The boot test's uffd stage serves a snapshot's pages with it.
      - name: Build the uffd page fault handler example
        working-directory: lib/firecracker
        run: cargo build --locked -p firecracker --example uffd_on_demand_handler --release
      # The boot test's vhost-user stage serves a drive with it.
      - name: Build the vhost-user-blk test backend
        working-directory: tools/vhost-user-blk
        env:
          CARGO_TARGET_DIR: ../../lib/firecracker/build/vhost-user-blk
        run: cargo build --release --locked
      # The host capability probe (tools/windows/winprobe.c), built with the
      # same MSVC toolchain the binary uses.
      - name: Build winprobe
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          cmd /c "`"$vs\VC\Auxiliary\Build\vcvars64.bat`" >nul && cl /nologo /W3 /O2 /D_CRT_SECURE_NO_WARNINGS tools\windows\winprobe.c advapi32.lib ws2_32.lib userenv.lib /Fe:winprobe.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      # The jailer test's probe and the memory-partition probe, so the kit
      # runs on a PC without Rust (tools/windows/jailer-test.ps1 uses the
      # built jail-probe.exe next to it).
      - name: Build the probes
        run: |
          rustc --edition 2021 -O -o tools/windows/jail-probe.exe tools/windows/jail-probe.rs
          # The operator's tool for a parent cgroup, and its own tests (how
          # it reads its arguments), which need nothing of the host.
          rustc --edition 2021 -O -o tools/windows/jail-parent.exe tools/windows/jail-parent.rs
          rustc --edition 2021 --test -o "$RUNNER_TEMP/jail-parent-test.exe" tools/windows/jail-parent.rs
          "$RUNNER_TEMP/jail-parent-test.exe"
          rustc --edition 2021 -O -o tools/windows/memory-partition-probe.exe tools/windows/memory-partition-probe.rs
      # Firecracker's gdb stub (upstream's test_gdb builds it), for
      # boot-test.ps1 gdb on a WHP machine. Built right before the kit's
      # upload, after every step before it that builds the workspace's
      # debug binaries: the debug profile's firecracker.exe is the one path,
      # and such a build replaces a gdb build with a plain one, as run
      # 43282663307's kit showed (no gdb_socket_path in its debug
      # firecracker.exe). The unit-test step, which builds them, runs after
      # the upload, so it replaces only the copy on the runner. The check
      # fails the job if the uploaded binary is not the gdb build.
      - name: Build firecracker with the gdb feature
        working-directory: lib/firecracker
        run: |
          cargo build --locked -p firecracker --features gdb
          grep -c -a gdb_socket_path build/cargo_target/debug/firecracker.exe \
            || { echo "::error::debug firecracker.exe has no gdb_socket_path: not the gdb build"; exit 1; }
      # For validation on Windows hardware with WHP (tools/windows/boot-test.ps1,
      # jailer-test.ps1): everything the stages need, at the paths they look in.
      - name: Upload Windows binaries
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wick-windows-x86_64-${{ github.sha }}
          path: |
            lib/firecracker/build/cargo_target/release/firecracker.exe
            lib/firecracker/build/cargo_target/release/firecracker.pdb
            lib/firecracker/build/cargo_target/release/snapshot-editor.exe
            lib/firecracker/build/cargo_target/release/jailer.exe
            lib/firecracker/build/cargo_target/release/rebase-snap.exe
            lib/firecracker/build/cargo_target/release/examples/uffd_on_demand_handler.exe
            lib/firecracker/build/cargo_target/debug/firecracker.exe
            lib/firecracker/build/vhost-user-blk/release/vhost-user-blk.exe
            winprobe.exe
            tools/windows/boot-test.ps1
            tools/windows/jailer-test.ps1
            tools/windows/jail-probe.exe
            tools/windows/jail-parent.exe
            tools/windows/job-freeze-probe.ps1
            tools/windows/memory-partition-probe.exe
            tools/windows/vmm-memory-record.py
            tools/windows/README.md
          if-no-files-found: error
          retention-days: 14
      # Every package's unit tests, as upstream's CI runs them on Linux (one
      # at a time: host_tools/cargo_build.py, RUST_TEST_THREADS=1), against
      # the differences tools/windows/unit-test-differences.txt lists with
      # their reasons: an unlisted failure, a listed test that passes and an
      # entry naming no test all fail the step.
      # After the kit's upload: a list that disagrees (a listed test that
      # passes, as test_vcpu_dump_cpu_config did in run 43302372278) fails the
      # job without costing the jailer's tests and build or the kit.
      - name: Unit tests against their listed differences
        if: success() || failure()
        run: python -I tools/windows/check-unit-tests.py --out "$RUNNER_TEMP/unit" --summary "$GITHUB_STEP_SUMMARY"
      - name: Upload the unit tests' output
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-unit-tests
          path: ${{ runner.temp }}/unit/*.log
          if-no-files-found: warn
          retention-days: 14
      # CI's runner has WHP (run 43277608081), so it is a WHP machine too
      # (the Host step records which): WHP's capabilities, then kvm-ioctls'
      # tests that need WHP, which the crate step leaves out (#[ignore]d, or
      # skipped there). Each runs alone, in a process of its own (a test
      # that leaves the process unable to map guest memory would spoil the
      # next), with --nocapture so the WHPCAP, BPTEST and MAPTEST lines it
      # prints are in the log, and must pass; what each expects is in its
      # comment. The bp tests were first measured on an AMD PC (70dfabf);
      # runs 43292883636 and 43298293407 had AMD runners too, so an Intel
      # runner, when one comes, gives their first Intel measurement
      # (test_bp_ways_on_record prints how each way to hand a #BP back
      # fares). The XSAVETEST lines say which kind of processor a run had:
      # WHP's XSAVE features, CPUID leaf 0xD's sizes, the size
      # KVM_CAP_XSAVE2 reports and the bytes WHP wrote for a vCPU's state
      # (past 4096 on a processor with AMX: run 43359525691, the first Intel
      # runner, where a fixed 4096 kept Firecracker from starting). Then libc's records of an AF_UNIX bind of each path form
      # (BINDTEST lines) and of what a non-blocking pipe takes of a write,
      # by size, room, kind of pipe and with a read waiting (PIPETEST
      # lines), and the vmm's record of what the network
      # endpoint's descriptor check costs a frame (the TAPCHECK line: the
      # unit tests' step built that test binary). Records only print; a
      # crash in one fails this step, never the kit. After the kit's upload,
      # so a WHP result never costs the PC its kit; it runs whatever the
      # steps before gave.
      - name: WHP tests on the runner
        if: success() || failure()
        working-directory: lib/firecracker
        run: |
          k=../../crates/compat/kvm-ioctls/Cargo.toml
          failed=0
          alone() {
            local out
            out=$(cargo test --locked --manifest-path "$k" "${@:2}" -- \
              --include-ignored --exact --nocapture --test-threads=1 "$1" 2>&1) || true
            printf '%s\n' "$out"
            if ! grep -q "test result: ok. 1 passed" <<<"$out"; then
              echo "::error::$1 did not pass alone"
              failed=1
            fi
          }
          for t in test_print_whp_capabilities \
              test_xsave_state_fits_the_area_the_capability_reports \
              test_vms_one_after_another_map_their_memory \
              test_one_partition_of_a_process_maps_memory \
              test_translate_as_kvm_at_the_entry_and_in_long_mode \
              test_tsc_and_its_adjust_restore_as_saved \
              test_no_clock_reference_is_made_of_a_tsc_that_was_not_read \
              test_maps_after_a_refused_map_once_both_vms_are_gone \
              test_a_vm_kept_alive_keeps_later_maps_refused \
              test_a_vm_with_an_irqfd_is_dropped_with_its_last_reference; do
            alone "whp::vm::tests::$t"
          done
          for t in test_bp_handed_back_to_the_guest \
              test_bp_window_holds_the_other_vcpus \
              test_bp_delivery_fault_is_the_guests \
              test_gdb_breakpoints_after_a_handed_back_bp \
              test_bp_ways_on_record; do
            alone "whp::vcpu::bp_tests::$t" --features gdb
          done
          # KVM_SET_FPU against a guest that stores what it finds: a write
          # to a vCPU whose guest has used x87 and SSE reaches the guest,
          # MXCSR excepted, as on Linux (asserted); the FPUTEST lines record
          # what WHP held before and after each write (KVM_GET_XSAVE2 and
          # KVM_GET_FPU), what the guest of a vCPU that had not run found
          # (Linux: the initial state, whatever was written), and what WHP
          # reads back of an area written with the x87 and SSE header bits
          # cleared, then set.
          alone whp::vcpu::fpu_tests::test_set_fpu_on_record
          # Which WHP call it is that commits a vCPU thread's stack: every
          # call a thread makes, with the stack committed before and after
          # it (STACKCALL lines), for what a booting Linux guest does and
          # the STACKTEST runs below did not (run 43385227122: 12 to 24 KiB
          # each, against a booted vCPU's 48 to 52, and no WHP call of the
          # boots reported as failed): the CPUID leaves answered from the
          # vCPU's state, kvm-clock and TSC_ADJUST, port input, string I/O
          # and MMIO through the emulator, the local APIC's page, a second
          # vCPU started by INIT and SIPI on its own thread, interrupts
          # (running, and ending a HLT), the TSC-deadline timer, a KVM
          # hypercall, and last a REP OUTSB (which run 43392627996 did not
          # get past; the run loop does the string instructions itself
          # since). Asserted for every step: no
          # WHP call of the vCPU's thread fails, and the thread's stack
          # stays within 40 KiB (16 to 24 measured without a refused call,
          # 52 with one, in that run).
          alone whp::vcpu::fpu_tests::test_the_stack_each_whp_call_commits_on_record
          # String port I/O (REP OUTSB, OUTSW, REP INSB, INSD, with the
          # direction flag too) and a device's memory with a second operand
          # in RAM (MOVSB either way): the exits and bytes Firecracker's
          # devices see are KVM's, and the guest's memory and registers
          # after (asserted; STRTEST lines, with REP MOVSB to and from a
          # device on record).
          alone whp::vcpu::fpu_tests::test_string_io_and_device_memory_beside_ram
          # What each call of the backend commits of its thread's stack
          # (STACKTEST lines), each on a thread of its own: which one leaves
          # a vCPU's thread 48 to 52 KiB deep, as the boot record of run
          # 43377614564 found every vCPU's (stale frames of an exception
          # raised and caught inside WinHvPlatform.dll).
          alone whp::vcpu::fpu_tests::test_the_stack_each_call_commits_on_record
          # What a CPU template's changes come to on WHP (TMPLTEST lines):
          # the guest's CPUID against a changed table (EAX and EDX asserted),
          # an XSETBV the table's leaf 0xd does not allow (KVM: #GP), and
          # for 0x10a, the MSR upstream's T2S and T2CL modify, and others no
          # WHP register holds: KVM_GET_MSRS and KVM_SET_MSRS end there
          # (asserted), and whether a guest's RDMSR comes to the backend.
          alone whp::vcpu::fpu_tests::test_what_a_cpu_template_changes_on_record
          k=../../crates/compat/libc/Cargo.toml
          alone windows_linux::tests::test_unix_bind_of_each_path_form_on_record
          alone windows_fd::tests::test_non_blocking_pipe_writes_on_record
          # A pipe's maker gets no identity of Firecracker's: the two tests
          # pass in the crates' own steps, which do not print a passing
          # test's lines; here for their SQOSTEST lines, what
          # ImpersonateNamedPipeClient answered for std's own open (the
          # control) and for ours (a refusal, or an anonymous token).
          k=../../crates/compat/os/Cargo.toml
          alone fifo::windows::tests::test_a_pipe_opened_again_gives_its_maker_no_identity
          k=../../crates/compat/std/Cargo.toml
          alone tests::test_a_pipe_opened_by_path_gives_its_maker_no_identity
          t=platform::windows::net::tests::test_descriptor_check_cost_on_record
          out=$(cargo test --locked -p vmm --lib -- \
            --include-ignored --exact --nocapture --test-threads=1 "$t" 2>&1) || true
          printf '%s\n' "$out"
          if ! grep -q "test result: ok. 1 passed" <<<"$out"; then
            echo "::error::$t did not pass alone"
            failed=1
          fi
          # The jailer's two records of nested Job Objects (no WHP in them),
          # for the design of --parent-cgroup: whether a jail's job, which
          # sets UI limits, nests under a parent job (Microsoft Learn says
          # no; Windows Server 2025 build 26100 did, run 43359525691: the
          # line names the build), and what nesting does (NESTTEST lines).
          # With them, the hugetlb page sizes test for its HUGETLBTEST line:
          # whether this runner's processor has 1 GiB pages, which decides
          # which of the test's two 1GB halves ran.
          # Then --parent-cgroup itself (platform::parent), each test alone
          # as it makes named jobs and processes: a parent's memory limit
          # bounds two jails together; a jailer's handle keeps the parent
          # and its limit when the tool is gone; a jail's processors and CPU
          # rate under a parent are Linux's by cgroup version (v1 refuses
          # what is outside the parent's, v2 takes what is common), nothing
          # narrowed without a word; a job of the parent's name labelled
          # below medium integrity, as a jailed process's would be, is not
          # joined; a parent of two levels holds a jail by each level's
          # limits; a thread with a jail's token neither opens the private
          # namespace the parents' jobs are named in, nor makes one of its
          # boundary, nor opens a parent's job (and what that token may do
          # in the session's own namespace, printed; and a namespace
          # outlasts its maker's handle while a second process, the test
          # program started again, has it open, and is gone with the last
          # handle: asserted since run 43388798760). They assert the
          # jailer's rules and print what Windows answered (PARENTTEST
          # lines). A jail's job under a parent has a name and, beside it,
          # what the jail was asked for, which the tool reads when a level
          # above is written.
          for t in test_a_jails_job_under_a_parent_job_on_record test_nested_jobs_on_record \
              test_hugetlb_page_sizes_are_linuxs \
              test_a_parent_bounds_its_jails_together test_a_parent_lasts_while_a_jail_holds_it \
              test_a_jail_under_a_parent_has_linuxs_cpus_and_rate \
              test_a_parent_made_below_medium_integrity_is_refused \
              test_a_parent_of_several_levels_bounds_by_each \
              test_a_jails_token_does_not_reach_a_parents_name \
              test_a_jails_job_under_a_parent_has_a_name_and_what_it_was_asked; do
            out=$(cargo test --locked -p jailer -- \
              --include-ignored --nocapture --test-threads=1 "$t" 2>&1) || true
            printf '%s\n' "$out"
            if ! grep -q "test result: ok. 1 passed" <<<"$out"; then
              echo "::error::$t did not pass alone"
              failed=1
            fi
          done
          # The operator's tool for a parent cgroup against real jobs: a
          # write to a level that is there is read back from every job below
          # it (TOOLTEST lines), with the test of how it reads its arguments;
          # and the same writes while a process runs in each jail's job, put
          # in its jobs from the top level down (TOOLTEST live lines: what
          # Windows answers each write of a job that has jobs nested under
          # it, each job's cap, each process's processors and CPU time).
          # Built in this step: the probes' build step does not run once a
          # step before it failed, and this one does (run 43397419784: the
          # harness step failed, and this step found no jail-parent-test.exe).
          if ! rustc --edition 2021 --test -o "$RUNNER_TEMP/jail-parent-test.exe" ../../tools/windows/jail-parent.rs; then
            echo "::error::jail-parent's tests did not build"
            failed=1
          fi
          out=$("$RUNNER_TEMP/jail-parent-test.exe" --include-ignored --nocapture --test-threads=1 2>&1) || true
          printf '%s\n' "$out"
          # Every test of the binary must pass (it holds the shared value
          # tests too, so their number is not fixed here), and the tests
          # against real jobs must have printed their lines.
          if ! grep -Eq "test result: ok\. [1-9][0-9]* passed; 0 failed" <<<"$out" \
              || ! grep -q "^TOOLTEST a level at 5000" <<<"$out" \
              || ! grep -q "^TOOLTEST live: the processes ended" <<<"$out"; then
            echo "::error::jail-parent's tests did not pass"
            failed=1
          fi
          # What Firecracker's own memory besides its guest's is made of with
          # 1, 2 and 16 vCPUs (VMMMEM lines), against upstream's tests' 5 MiB
          # for it: a microVM whose guest is the script's own `hlt` loop.
          # The release build has no PDB of Firecracker's own functions (run
          # 43377614564 named its frames by the nearest symbol of std's):
          # the same binary linked again with the linker's map, which names
          # them by address. `-MAP`, not `/MAP`: Git Bash rewrites an
          # argument that looks like a path.
          map="$(cygpath -w "$RUNNER_TEMP")\\firecracker.map"
          if ! cargo rustc --locked -p firecracker --release --bin firecracker -- -C "link-arg=-MAP:$map"; then
            echo "::error::firecracker did not link with a map"
            failed=1
          fi
          if ! python -I ../../tools/windows/vmm-memory-record.py --map "$RUNNER_TEMP/firecracker.map" \
              build/cargo_target/release/firecracker.exe; then
            echo "::error::vmm-memory-record.py did not finish"
            failed=1
          fi
          # The same with a guest whose vCPUs all run: upstream's CI kernel
          # and root file system (the linux-boot job's, from the same
          # bucket), a network interface, the guest's shell on the serial
          # console. Besides the VMMMEM lines, each thread's stack and the
          # return addresses on the deepest stacks (VMMSTACK lines), named
          # from the map: what a running vCPU's stack is made of; and which
          # allocations grow with each vCPU (VMMGROW lines). A Linux guest
          # boots on the runner (run 43377614564); should one not, the
          # lines say how far it came and the step notes it with a warning.
          if ! python -I ../../tools/windows/vmm-memory-record.py --map "$RUNNER_TEMP/firecracker.map" \
              --boot "$RUNNER_TEMP/vmmmem-guest" \
              build/cargo_target/release/firecracker.exe 1 2 16; then
            echo "::warning::vmm-memory-record.py --boot: no record of a booted guest on this runner"
          fi
          exit $failed
      # wick-os's standard input on a console (a hidden console of its own,
      # made for a child process): ignored in the crate step above so that a
      # runner without a console cannot cost the kit; run alone here, after
      # the upload, and must pass.
      - name: Standard input on a console
        if: success() || failure()
        working-directory: lib/firecracker
        run: |
          cargo test --locked --manifest-path ../../crates/compat/os/Cargo.toml -- \
            --include-ignored --exact --nocapture \
            windows::stdio::tests::test_a_console_without_characters_reads_as_eagain \
            2>&1 | tee "$RUNNER_TEMP/stdio-console.log"
          test "${PIPESTATUS[0]}" -eq 0
          grep -q "1 passed" "$RUNNER_TEMP/stdio-console.log"

  # The Windows scenario tests with a guest, on the hosted runner: it has
  # WHP and boots Linux (run 43377614564, the windows job's memory record).
  # tools/windows/boot-test.ps1 and jailer-test.ps1 run as on a PC, from the
  # kit the windows job uploaded (no second build), in Windows PowerShell
  # 5.1, each script collecting its own stages' PASS and FAIL. Every step
  # runs whatever failed before it, and a failed stage fails the job; each
  # script's logs are uploaded. The runner is elevated, Windows Server, and
  # has no interactive desktop: the jailer unelevated, Windows 11 and a
  # serial console someone types at stay with the PC (tools/windows/README.md).
  windows-guest:
    # linux-boot makes the snapshot of the linux-snapshot stage; without it
    # that stage alone fails, saying what it lacks.
    needs: [windows, linux-boot]
    if: ${{ !cancelled() && needs.windows.result == 'success' }}
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: powershell
    env:
      WBT: ${{ github.workspace }}\wbt
      WJT: ${{ github.workspace }}\wjt
    steps:
      - name: The kit of this commit
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: wick-windows-x86_64-${{ github.sha }}
          path: .
      - name: The snapshot made on Linux
        id: snapshot
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: linux-snapshot
          path: ${{ runner.temp }}/linux-snapshot
      # The machine on record: the image, the processor, whether this token
      # is elevated and what it holds.
      - name: Host
        run: |
          Get-CimInstance Win32_OperatingSystem | Format-List Caption, Version, BuildNumber
          Get-CimInstance Win32_Processor | Format-List Name, NumberOfCores, NumberOfLogicalProcessors
          Get-CimInstance Win32_ComputerSystem | Format-List Model, TotalPhysicalMemory, HypervisorPresent
          whoami /user /priv
          Get-ChildItem -Recurse -File lib, tools, winprobe.exe | Select-Object Length, FullName | Format-Table -AutoSize
      # Every stage of `all` but hugepages (its own step below) and
      # foreign-snapshot (it wants a state of another architecture, which no
      # job makes: the summary says so), and diff-nospace, which needs the
      # elevation this runner has. A stage that fails does not stop the
      # others; the script's exit status fails the step.
      - name: boot-test.ps1
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File tools\windows\boot-test.ps1 -WorkDir $env:WBT `
            -Stage boot,smp,block,vsock,net,snapshot,diff,diff-nospace,uffd,pci,restores,vhost-user,api-process,devices,balloon,cli,tools,no-seccomp,memory-hotplug,cpu-templates
          exit $LASTEXITCODE
      # The snapshot the linux-boot job of this run made (KVM, this commit's
      # build), loaded and resumed on WHP. A record: the stage's line says
      # RESTORED or REFUSED with Firecracker's error, and it fails only on
      # what is neither.
      - name: boot-test.ps1 linux-snapshot
        if: success() || failure()
        run: |
          Get-Content "$env:RUNNER_TEMP\linux-snapshot\linux-x86_64.txt" -ErrorAction SilentlyContinue
          powershell -NoProfile -ExecutionPolicy Bypass -File tools\windows\boot-test.ps1 -WorkDir $env:WBT -Stage linux-snapshot `
            -LinuxSnapshot "$env:RUNNER_TEMP\linux-snapshot"
          exit $LASTEXITCODE
      # The guest files are the boot test's (-Assets). pidns, bindlink and
      # hugepages have steps of their own.
      - name: jailer-test.ps1
        if: success() || failure()
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File tools\windows\jailer-test.ps1 -WorkDir $env:WJT -Assets $env:WBT `
            -Stage refuse,freeze,cpuset,parent,weight,low,links,nofile,sections,daemonize,handles,handoff,netns,netguest,api,isolation,boot,limits,memory,cpu,uffd,vhost-user
          exit $LASTEXITCODE
      # pidns types into its console and reads it, and a step has none: the
      # script runs in a console of its own, as in a PowerShell window, and
      # its output is the summary it writes.
      - name: jailer-test.ps1 pidns, in a console of its own
        if: success() || failure()
        run: |
          $p = Start-Process powershell -PassThru -Wait -ArgumentList @('-NoProfile', '-ExecutionPolicy', 'Bypass', '-File',
            'tools\windows\jailer-test.ps1', '-WorkDir', "$env:WJT-pidns", '-Assets', $env:WBT, '-Stage', 'pidns')
          Get-Content "$env:WJT-pidns\summary.txt" -ErrorAction SilentlyContinue
          if ($p.ExitCode -ne 0) { Write-Host "::error::jailer-test.ps1 pidns: exit $($p.ExitCode)"; exit 1 }
      # A record: the stage has passed its first check nowhere (the one PC,
      # Windows 11 build 26300, has no bindlink.dll). What this image answers
      # is in the stage's line.
      - name: jailer-test.ps1 bindlink
        if: success() || failure()
        run: |
          Get-Item "$env:SystemRoot\System32\bindlink.dll", "$env:SystemRoot\System32\bindfltapi.dll" -ErrorAction SilentlyContinue |
            Format-Table Name, Length, @{ n = 'Version'; e = { $_.VersionInfo.FileVersion } }
          powershell -NoProfile -ExecutionPolicy Bypass -File tools\windows\jailer-test.ps1 -WorkDir "$env:WJT-bindlink" -Assets $env:WBT -Stage bindlink
          exit $LASTEXITCODE
      # Large pages need "Lock pages in memory" in the token, and a right
      # given to an account reaches only a logon made after it. So: the right
      # is given to this account (secedit), the account gets a password of
      # this job's making, and the two hugepages stages run in a scheduled
      # task as that account, which is a new logon. The task's own first
      # lines say whether its token holds the privilege; if this cannot be
      # set up, the step fails saying which part, and the stages stay the
      # PC's.
      - name: hugepages stages, in a logon that holds Lock pages in memory
        if: success() || failure()
        run: |
          $ErrorActionPreference = 'Stop'
          $sid = [Security.Principal.WindowsIdentity]::GetCurrent().User.Value
          $user = "$env:COMPUTERNAME\$env:USERNAME"
          $dir = Join-Path $env:RUNNER_TEMP 'hugepages'
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          $cfg = Join-Path $dir 'rights.inf'
          secedit /export /cfg $cfg /areas USER_RIGHTS | Out-Null
          $lines = Get-Content $cfg
          if ($lines -match '^SeLockMemoryPrivilege') {
              $lines = $lines | ForEach-Object { if ($_ -match '^SeLockMemoryPrivilege' -and $_ -notmatch [regex]::Escape($sid)) { "$_,*$sid" } else { $_ } }
          } else {
              $lines = $lines | ForEach-Object { $_; if ($_ -eq '[Privilege Rights]') { "SeLockMemoryPrivilege = *$sid" } }
          }
          $lines | Set-Content -Encoding Unicode $cfg
          secedit /configure /db (Join-Path $dir 'rights.sdb') /cfg $cfg /areas USER_RIGHTS | Out-Null
          if ($LASTEXITCODE -ne 0) { Write-Host "::error::hugepages: secedit could not give $user Lock pages in memory (exit $LASTEXITCODE)"; exit 1 }
          $bytes = New-Object byte[] 18
          [Security.Cryptography.RandomNumberGenerator]::Create().GetBytes($bytes)
          $password = 'Wk1!' + [Convert]::ToBase64String($bytes)
          net user $env:USERNAME $password | Out-Null
          if ($LASTEXITCODE -ne 0) { Write-Host "::error::hugepages: the account's password could not be set (exit $LASTEXITCODE)"; exit 1 }
          $script = Join-Path $dir 'run.ps1'
          $root = (Get-Location).Path
          @"
          Set-Location '$root'
          whoami /priv > '$dir\priv.txt' 2>&1
          powershell -NoProfile -ExecutionPolicy Bypass -File tools\windows\boot-test.ps1 -WorkDir '$env:WBT' -Stage hugepages > '$dir\boot-test.txt' 2>&1
          "boot-test `$LASTEXITCODE" > '$dir\boot-test.exit'
          powershell -NoProfile -ExecutionPolicy Bypass -File tools\windows\jailer-test.ps1 -WorkDir '$env:WJT-hugepages' -Assets '$env:WBT' -Stage hugepages > '$dir\jailer-test.txt' 2>&1
          "jailer-test `$LASTEXITCODE" > '$dir\jailer-test.exit'
          'done' > '$dir\done'
          "@ | Set-Content -Encoding UTF8 $script
          schtasks /Create /F /TN wick-hugepages /SC ONCE /ST 00:00 /RL HIGHEST /RU $user /RP $password `
            /TR "powershell -NoProfile -ExecutionPolicy Bypass -File `"$script`"" | Out-Null
          if ($LASTEXITCODE -ne 0) { Write-Host "::error::hugepages: the task could not be made for $user (exit $LASTEXITCODE)"; exit 1 }
          schtasks /Run /TN wick-hugepages | Out-Null
          $deadline = [DateTime]::Now.AddMinutes(15)
          while (-not (Test-Path "$dir\done") -and [DateTime]::Now -lt $deadline) { Start-Sleep -Seconds 2 }
          schtasks /Query /TN wick-hugepages /V /FO LIST | Select-String 'Status|Last Result|Run As User'
          schtasks /Delete /F /TN wick-hugepages | Out-Null
          foreach ($f in 'priv.txt', 'boot-test.txt', 'jailer-test.txt', 'boot-test.exit', 'jailer-test.exit') {
              Write-Host "== $f"; Get-Content "$dir\$f" -ErrorAction SilentlyContinue
          }
          if (-not (Test-Path "$dir\done")) { Write-Host '::error::hugepages: the task did not finish in 15 minutes (see its status above)'; exit 1 }
          if (-not (Select-String -Quiet 'SeLockMemoryPrivilege' "$dir\priv.txt")) {
              Write-Host "::error::hugepages: the task's token does not hold SeLockMemoryPrivilege: the stages ran without what they need"
          }
          $bad = @(Get-Content "$dir\boot-test.exit", "$dir\jailer-test.exit" | Where-Object { $_ -notmatch ' 0$' })
          if ($bad) { Write-Host "::error::hugepages stages failed: $($bad -join ', ')"; exit 1 }
      # A gdb that reads x86-64 Linux kernels: MSYS2's gdb-multiarch, the
      # package pinned by its file and checksum, its dependencies from the
      # image's MSYS2. The Firecracker is the kit's gdb build (the debug one).
      - name: boot-test.ps1 gdb
        if: success() || failure()
        run: |
          $ErrorActionPreference = 'Stop'
          $name = 'mingw-w64-ucrt-x86_64-gdb-multiarch-18.1-3-any.pkg.tar.zst'
          $pkg = Join-Path $env:RUNNER_TEMP $name
          Invoke-WebRequest -UseBasicParsing "https://repo.msys2.org/mingw/ucrt64/$name" -OutFile $pkg
          $hash = (Get-FileHash -Algorithm SHA256 $pkg).Hash.ToLower()
          if ($hash -ne '7012a9a85024bf721c8195b0724e7f88aac922d6ae38ce10793bab904f69fb22') { Write-Host "::error::gdb: $name has checksum $hash"; exit 1 }
          if (-not (Test-Path C:\msys64\usr\bin\pacman.exe)) { Write-Host '::error::gdb: this image has no MSYS2 at C:\msys64 to install the package with'; exit 1 }
          $env:PATH = "C:\msys64\usr\bin;$env:PATH"
          pacman -U --noconfirm --needed ($pkg -replace '\\', '/')
          if ($LASTEXITCODE -ne 0) { Write-Host "::error::gdb: pacman could not install $name (exit $LASTEXITCODE)"; exit 1 }
          & C:\msys64\ucrt64\bin\gdb-multiarch.exe --version | Select-Object -First 1
          powershell -NoProfile -ExecutionPolicy Bypass -File tools\windows\boot-test.ps1 -WorkDir $env:WBT -Stage gdb `
            -Gdb C:\msys64\ucrt64\bin\gdb-multiarch.exe
          exit $LASTEXITCODE
      - name: What ran, and what stays with the PC
        if: always()
        run: |
          $out = @('## Windows stages on the runner', '')
          foreach ($f in Get-ChildItem -Path "$env:WJT*\summary.txt" -ErrorAction SilentlyContinue) { $out += '```'; $out += Get-Content $f; $out += '```' }
          foreach ($f in Get-ChildItem -Path "$env:RUNNER_TEMP\hugepages\*.exit" -ErrorAction SilentlyContinue) { $out += "- hugepages: $(Get-Content $f)" }
          $out += ''
          $out += 'boot-test.ps1 prints its stages in its step and keeps them in the results archive of the artifact.'
          $out += ''
          $out += 'Not run here, the PC''s: the jailer unelevated (this token is elevated), Windows 11 (this is Windows Server),'
          $out += 'a serial console someone types at, and boot-test.ps1 foreign-snapshot (it needs a state file of another'
          $out += 'architecture, the macOS boot test''s; no job of this workflow makes one).'
          $out | Add-Content -Encoding UTF8 $env:GITHUB_STEP_SUMMARY
      - name: Upload the stages' logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-guest-logs
          path: |
            wbt/results-*.zip
            wjt*/summary.txt
            wjt*/**/*.txt
            wjt*/**/*.log
            ${{ runner.temp }}/hugepages/*.txt
            ${{ runner.temp }}/hugepages/*.exit
          if-no-files-found: warn
          retention-days: 14
