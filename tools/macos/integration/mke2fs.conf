# mke2fs's configuration for upstream's tests on macOS
# (tools/macos/integration-tests.sh sets MKE2FS_CONFIG to it).
#
# e2fsprogs' own (Homebrew's) gives a file system under 512 MiB ("small",
# "floppy") 1 KiB blocks. Upstream's tests run in its devctr (Ubuntu 24.04),
# whose mke2fs gives the 1 and 2 MiB file systems of test_pmem.py 4 KiB ones:
# they pass on Linux mounted with DAX, which a guest takes only for blocks of
# its page size ("EXT4-fs (pmem0): unsupported blocksize for DAX" with 1 KiB).
# This is e2fsprogs' file without the 1 KiB block size.
[defaults]
	base_features = sparse_super,large_file,filetype,resize_inode,dir_index,ext_attr
	default_mntopts = acl,user_xattr
	enable_periodic_fsck = 0
	blocksize = 4096
	inode_size = 256
	inode_ratio = 16384

[fs_types]
	ext3 = {
		features = has_journal
	}
	ext4 = {
		features = has_journal,extent,huge_file,flex_bg,metadata_csum,metadata_csum_seed,64bit,dir_nlink,extra_isize,orphan_file
	}
	small = {
		inode_ratio = 4096
	}
	floppy = {
		inode_ratio = 8192
	}
	big = {
		inode_ratio = 32768
	}
	huge = {
		inode_ratio = 65536
	}
	news = {
		inode_ratio = 4096
	}
	largefile = {
		inode_ratio = 1048576
		blocksize = -1
	}
	largefile4 = {
		inode_ratio = 4194304
		blocksize = -1
	}
	hurd = {
	     blocksize = 4096
	     inode_size = 128
	     warn_y2038_dates = 0
	}
