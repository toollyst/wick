# Compatibility build of vhost-user-backend for the vhost-user-blk test backend
# (docs/ARCHITECTURE.md). On Linux and macOS it re-exports the upstream crate
# unchanged. On Windows it builds the upstream source over wick's POSIX layer
# (generated by tools/gen-windows-sources.sh), as crates/compat/vhost does.
[package]
name = "vhost-user-backend"
version = "0.23.0"
authors = ["toollyst contributors"]
edition = "2021"
license = "Apache-2.0"
publish = false
description = "vhost-user-backend 0.23.0, on Windows too."

[lib]
bench = false
doctest = false

[features]
# Linux and macOS only.
postcopy = ["upstream/postcopy"]
xen = ["upstream/xen"]

[target.'cfg(not(windows))'.dependencies]
# The crates.io release itself: its vhost is the patched crates/compat/vhost,
# so the backend has one vhost.
upstream = { package = "vhost-user-backend", version = "=0.23.0" }

[target.'cfg(windows)'.dependencies]
wick-os = { path = "../../../../crates/compat/os" }
libc = "0.2.39"
log = "0.4.17"
vhost = { version = "0.17.0", features = ["vhost-user-backend"] }
virtio-bindings = "0.2.7"
virtio-queue = "0.18.0"
vm-memory = { version = "0.18.0", features = ["backend-mmap", "backend-atomic", "backend-bitmap"] }
vmm-sys-util = "0.15.0"
