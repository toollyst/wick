#
# Host folder sharing (docs/design-fs.md): the frames between wick's virtio-fs
# device and the file server, and (later) the server, wick-fsd. A workspace of
# its own, outside upstream's: the server links the real libc crate, never
# the compatibility libc Firecracker builds with (its memory hooks are the
# VMM's), and upstream's workspace members do not change. wick-ext takes
# `frame`, which has no dependencies, by path.

[workspace]
members = ["frame"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "Apache-2.0"
authors = ["toollyst contributors"]

# Firecracker's workspace lints (lib/firecracker/Cargo.toml), so code moving
# between the two is held to the same rules.
[workspace.lints.rust]
missing_debug_implementations = "warn"
unsafe_code = "forbid"

[workspace.lints.clippy]
ptr_as_ptr = "warn"
undocumented_unsafe_blocks = "warn"
cast_possible_truncation = "warn"
cast_possible_wrap = "warn"
cast_sign_loss = "warn"
exit = "warn"
tests_outside_test_module = "warn"
assertions_on_result_states = "warn"
error_impl_error = "warn"
or_fun_call = "warn"

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
lto = true
