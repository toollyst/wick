# Compatibility build of micro_http for wick (docs/ARCHITECTURE.md).
# On Linux and macOS it re-exports the upstream crate unchanged. On Windows it
# builds the upstream source over wick's POSIX layer (generated by
# tools/gen-windows-sources.sh). vmm and firecracker depend on it by path,
# as a [patch] of the git source would also replace the upstream dependency.
[package]
workspace = "../../../lib/firecracker"
name = "micro_http"
version = "0.1.0"
authors = ["toollyst contributors"]
edition = "2021"
license = "Apache-2.0"
publish = false
description = "micro_http, with its Unix interface on Windows."

[lib]
bench = false
doctest = false

[target.'cfg(not(windows))'.dependencies]
# The revision upstream Firecracker locks (Cargo.lock).
upstream = { package = "micro_http", git = "https://github.com/firecracker-microvm/micro-http", rev = "7975fe0e59000e8c41cb1d58fbd39ffa102e5b27" }

[target.'cfg(windows)'.dependencies]
wick-os = { path = "../os" }
libc = "0.2.189"
vmm-sys-util = "0.15.0"
