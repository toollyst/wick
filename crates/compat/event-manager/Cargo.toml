# Compatibility build of event-manager for wick (docs/ARCHITECTURE.md).
# On Linux and macOS it re-exports the upstream crate unchanged. On Windows it
# builds the upstream source over wick's POSIX layer (generated by
# tools/gen-windows-sources.sh).
[package]
workspace = "../../../lib/firecracker"
name = "event-manager"
version = "0.4.2"
authors = ["toollyst contributors"]
edition = "2021"
license = "Apache-2.0 OR BSD-3-Clause"
publish = false
description = "event-manager 0.4.2, with its Unix interface on Windows."

[lib]
bench = false
doctest = false

[features]
remote_endpoint = ["upstream/remote_endpoint"]
test_utilities = ["upstream/test_utilities"]

[target.'cfg(not(windows))'.dependencies]
# Same source as the crates.io 0.4.2 release (src/ is identical, checked 2026-11-09).
upstream = { package = "event-manager", git = "https://github.com/rust-vmm/event-manager", tag = "v0.4.2" }

[target.'cfg(windows)'.dependencies]
wick-os = { path = "../os" }
libc = "0.2.189"
vmm-sys-util = "0.15.0"
