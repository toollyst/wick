# Compatibility build of vmm-sys-util for wick (docs/ARCHITECTURE.md).
# On Linux it re-exports the original crate unchanged. On macOS it adds the
# Linux-only modules Firecracker needs (eventfd, epoll, ...).
[package]
workspace = "../../../lib/firecracker"
name = "vmm-sys-util"
version = "0.15.0"
authors = ["toollyst contributors"]
edition = "2021"
license = "BSD-3-Clause"
publish = false
description = "vmm-sys-util 0.15.0 with macOS and Windows implementations of its Unix-only modules."

[lib]
name = "vmm_sys_util"
# The doc examples are the original Linux ones (they open /dev/kvm).
doctest = false
bench = false

[features]
with-serde = ["upstream/with-serde"]

[dependencies]
# Same source as the crates.io 0.15.0 release (src/ is identical, checked 2026-11-09).
upstream = { package = "vmm-sys-util", git = "https://github.com/rust-vmm/vmm-sys-util", tag = "v0.15.0" }

[target.'cfg(target_os = "macos")'.dependencies]
bitflags = "1.0"
libc = "0.2.127"

[target.'cfg(windows)'.dependencies]
bitflags = "1.0"
wick-os = { path = "../os" }
libc = "0.2.127"
polling = "3.11"
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Networking_WinSock",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_LibraryLoader",
    "Win32_System_IO",
    "Win32_System_Kernel",
    "Win32_System_Memory",
    "Win32_System_Threading",
] }
