# Compatibility build of kvm-ioctls for wick
# (docs/ARCHITECTURE.md).
# On Linux it re-exports the crates.io kvm-ioctls 0.25.0 unchanged. On macOS it
# implements the subset of the API Firecracker uses on Hypervisor.framework, and
# on Windows the same subset on the Windows Hypervisor Platform (WHP).
[package]
workspace = "../../../lib/firecracker"
name = "kvm-ioctls"
version = "0.25.0"
authors = ["toollyst contributors"]
edition = "2024"
license = "Apache-2.0 OR MIT"
publish = false

[lib]
bench = false

[features]
# Guest debugging for Firecracker's gdb stub (vmm's `gdb`): on Windows the
# partition is made with exception exits (src/whp/debug.rs). No effect on
# Linux or macOS.
gdb = []
# A build for CI's record, never a release: on Windows the backend prints on
# standard error each WHP call during which the calling thread's committed
# stack grew by 16 KiB or more (WHPTRACE lines; src/whp/ffi.rs, `trace`). No
# effect on Linux or macOS.
whp-trace = []
# A build for CI's and a PC's record, never a release: on Windows the
# partitions are made as option E makes them, x2APICs on AMD hosts
# (src/whp/vm.rs, `X2APIC_PARTITIONS`), for boot-test.ps1's x2apic stage
# before the product turns them on, and the first VM says so on standard
# error. tools/check-record-features.sh fails a release or the CI kit's
# product binaries that have it. No effect on Linux or macOS.
whp-x2apic-record = []

[target.'cfg(target_os = "linux")'.dependencies]
# Same source as the crates.io 0.25.0 release (src/ is identical, checked 2026-11-09).
# kvm-bindings is patched to the same tag in the root Cargo.toml so there is one copy.
upstream = { package = "kvm-ioctls", git = "https://github.com/rust-vmm/kvm", tag = "kvm-ioctls-v0.25.0" }

[target.'cfg(target_os = "macos")'.dependencies]
kvm-bindings = { version = "0.14.0", features = ["fam-wrappers"] }
libc = "0.2.186"
# The PV time kicker's debug line (src/hvf/pvtime.rs).
log = "0.4.33"
vmm-sys-util = "0.15.0"

[target.'cfg(windows)'.dependencies]
wick-os = { path = "../os" }
kvm-bindings = { version = "0.14.0", features = ["fam-wrappers"] }
libc = "0.2.186"
# What the backend reports goes through Firecracker's logger as well
# (whp/ffi.rs, `report`).
log = "0.4.33"
vmm-sys-util = "0.15.0"
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_System_Hypervisor",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Threading",
] }
