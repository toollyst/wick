# Compatibility build of vhost for wick (docs/ARCHITECTURE.md).
# On Linux and macOS it re-exports the upstream crate unchanged. On Windows it
# builds the upstream source over wick's POSIX layer (generated by
# tools/gen-windows-sources.sh); the kernel vhost backends need Linux.
[package]
workspace = "../../../lib/firecracker"
name = "vhost"
version = "0.17.0"
authors = ["toollyst contributors"]
edition = "2021"
license = "Apache-2.0 OR BSD-3-Clause"
publish = false
description = "vhost 0.17.0, with its vhost-user interface on Windows."

[lib]
bench = false
doctest = false

[features]
default = []
postcopy = ["upstream/postcopy"]
test-utils = ["upstream/test-utils"]
vhost-kern = ["upstream/vhost-kern"]
vhost-net = ["upstream/vhost-net", "vhost-kern"]
vhost-user = ["upstream/vhost-user"]
vhost-user-backend = ["upstream/vhost-user-backend", "vhost-user"]
vhost-user-frontend = ["upstream/vhost-user-frontend", "vhost-user"]
vhost-vdpa = ["upstream/vhost-vdpa", "vhost-kern"]
vhost-vsock = ["upstream/vhost-vsock"]
xen = ["upstream/xen", "vm-memory/xen"]

[target.'cfg(not(windows))'.dependencies]
# Same source as the crates.io 0.17.0 release (src/ is identical, checked 2026-11-09).
upstream = { package = "vhost", git = "https://github.com/rust-vmm/vhost", tag = "vhost-v0.17.0" }

[target.'cfg(windows)'.dependencies]
bitflags = "2.4"
wick-os = { path = "../os" }
libc = "0.2.189"
uuid = { version = "1.11.0", default-features = false, features = ["v4", "fast-rng"] }
vm-memory = { version = "0.18.0", features = ["backend-mmap"] }
vmm-sys-util = "0.15.0"

[target.'cfg(windows)'.dev-dependencies]
serial_test = "3.0"
tempfile = "3.2.0"
