# Compatibility build of polling for wick (docs/ARCHITECTURE.md).
# Only wick's Windows vmm-sys-util uses it (its epoll). On Linux and macOS it
# is empty and depends on nothing, so that those builds compile what
# upstream's compile, with the same features (a re-export there unified
# rustix's features with polling's: CI run 43790310601's comparison). On
# Windows it builds the upstream source with one change, to its waitable sources: a removal returns once the
# thread pool no longer waits on the handle, nor runs a callback for it, and a
# wait registered again allocates nothing (generated by
# tools/gen-windows-sources.sh; the change is
# tools/gen-windows-sources-polling.py).
[package]
workspace = "../../../lib/firecracker"
name = "polling"
version = "3.11.0"
authors = ["toollyst contributors"]
edition = "2021"
license = "Apache-2.0 OR MIT"
publish = false
description = "polling 3.11.0, whose waitable removal waits for the thread pool's wait to end and whose waits are registered again without an allocation."

[lib]
bench = false
doctest = false

# The source tools/gen-windows-sources.sh generates from (it finds it with
# `cargo metadata`): locked, and built for no target (`cfg(any())` holds on
# none), so its dependencies and their features enter no build.
[target.'cfg(any())'.dependencies]
upstream = { package = "polling", version = "=3.11.0" }

[target.'cfg(windows)'.dependencies]
# Upstream's dependencies on Windows (polling 3.11.0's Cargo.toml), but its
# optional tracing, which wick does not turn on.
cfg-if = "1"
concurrent-queue = "2.2.0"
pin-project-lite = "0.2.9"
windows-sys = { version = "0.61", features = [
    "Wdk_Foundation",
    "Wdk_Storage_FileSystem",
    "Win32_Foundation",
    "Win32_Networking_WinSock",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_System_WindowsProgramming",
] }

[lints.rust.unexpected_cfgs]
level = "warn"
check-cfg = ["cfg(polling_test_poll_backend)", "cfg(polling_test_epoll_pipe)"]
