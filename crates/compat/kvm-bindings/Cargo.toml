# Compatibility build of kvm-bindings for wick (docs/ARCHITECTURE.md).
# On Linux and macOS it re-exports the upstream crate at the kvm-ioctls tag unchanged.
# On Windows it builds the same x86_64 bindings with c_ulong/c_long fixed to 64 bits
# (generated by tools/gen-kvm-bindings-windows.sh).
[package]
workspace = "../../../lib/firecracker"
name = "kvm-bindings"
version = "0.14.1"
authors = ["toollyst contributors"]
edition = "2021"
license = "Apache-2.0 OR MIT"
publish = false

[lib]
bench = false
doctest = false

[features]
fam-wrappers = ["upstream/fam-wrappers", "dep:vmm-sys-util"]
serde = ["upstream/serde", "dep:serde", "dep:zerocopy"]

[target.'cfg(not(windows))'.dependencies]
upstream = { package = "kvm-bindings", git = "https://github.com/rust-vmm/kvm", tag = "kvm-ioctls-v0.25.0" }

[target.'cfg(windows)'.dependencies]
vmm-sys-util = { version = "0.15.0", optional = true }
serde = { version = "1.0.0", optional = true, features = ["derive"] }
zerocopy = { version = "0.8.23", optional = true, features = ["derive"] }
