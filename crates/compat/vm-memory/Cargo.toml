# Compatibility build of vm-memory for wick (docs/ARCHITECTURE.md).
# On Linux and macOS it re-exports the upstream crate unchanged. On Windows it
# builds the upstream source with its Unix mmap backend, over wick's POSIX
# layer (generated by tools/gen-windows-sources.sh).
[package]
workspace = "../../../lib/firecracker"
name = "vm-memory"
version = "0.18.0"
authors = ["toollyst contributors"]
edition = "2021"
license = "Apache-2.0 OR BSD-3-Clause"
publish = false
description = "vm-memory 0.18.0, with its Unix interface on Windows."

[lib]
bench = false
doctest = false

[features]
default = ["rawfd"]
backend-atomic = ["upstream/backend-atomic", "dep:arc-swap"]
backend-bitmap = ["upstream/backend-bitmap"]
backend-mmap = ["upstream/backend-mmap"]
iommu = ["upstream/iommu", "dep:rangemap"]
rawfd = ["upstream/rawfd"]
# Not available on Windows (the generated source refuses it).
xen = ["upstream/xen"]

[target.'cfg(not(windows))'.dependencies]
# Same source as the crates.io 0.18.0 release (src/ is identical, checked 2026-11-09).
upstream = { package = "vm-memory", git = "https://github.com/rust-vmm/vm-memory", tag = "v0.18.0", default-features = false }

[target.'cfg(windows)'.dependencies]
arc-swap = { version = "1.0.0", optional = true }
wick-os = { path = "../os" }
libc = "0.2.189"
rangemap = { version = "1.5.1", optional = true }
thiserror = "2.0.16"

[target.'cfg(windows)'.dev-dependencies]
matches = "0.1.0"
vmm-sys-util = "0.15.0"
