#
# Fuzz targets for wick's own host-side code (CONTRIBUTING.md, "Fuzzing"), run
# with cargo-fuzz through tools/fuzz.sh. Not part of any release.
[package]
name = "wick-fuzz"
version = "0.0.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[package.metadata]
cargo-fuzz = true

[workspace]

[dependencies]
libfuzzer-sys = "0.4.10"
arbitrary = { version = "1.4.1", features = ["derive"] }
libc = "0.2.189"
# whp/exit.rs's RAMRETRY reporter names `log::Level`; the `ffi::report` shim in
# src/lib.rs takes it, as the real `whp::ffi::report` does (log = "0.4.33" there).
log = "0.4.33"

# The frames between the virtio-fs device and wick-fsd (fs_frame); a crate
# without dependencies, taken by path from crates/fs's workspace.
wick-fs-frame = { path = "../crates/fs/frame" }
# wick-fsd's FUSE decoder and guest names (fs_decode); no dependencies but
# the frame crate.
wick-fsd = { path = "../crates/fs/fsd" }

# The compatibility crates Firecracker builds with (docs/ARCHITECTURE.md).
[patch.crates-io]
libc = { path = "../crates/compat/libc" }

[[bin]]
name = "vnet_segment"
path = "fuzz_targets/vnet_segment.rs"
test = false
doc = false
bench = false

[[bin]]
name = "vnet_offload"
path = "fuzz_targets/vnet_offload.rs"
